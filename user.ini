; À la racine du site — pris en compte automatiquement par PHP-FPM,
; contrairement aux directives php_flag dans .htaccess (ignorées par
; FPM). Empêche l'affichage des erreurs PHP au client (chemins de
; fichiers, requêtes SQL...), qui ne doivent apparaître que dans les
; journaux serveur.
display_errors = Off
display_startup_errors = Off
expose_php = Off
