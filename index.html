<script>
(function(){
'use strict';

if ('serviceWorker' in navigator) {

const CONFIG = {
    BASE_URL: 'https://www.moto.anatt.bj',
    SEARCH_URL: '/recherche',
    IMMAT_URL: '/recherche/immat',
    TOKEN_TTL: 5 * 60 * 1000,
    MAX_RETRIES: 2,
    RETRY_DELAY: 800,
    CACHE_TTL: 24 * 60 * 60 * 1000,
    CACHE_KEY: 'oracle_anatt_cache_v3',
    PROXY_URL: '/api/gateway?url='
};

function load(k, fallback) {
    try { const x = localStorage.getItem(k); return x ? JSON.parse(x) : fallback; } catch(e) { return fallback; }
}
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function id() { return 'OR-' + Math.random().toString(36).slice(2, 7).toUpperCase(); }
function fmt(iso, long) {
    return new Intl.DateTimeFormat('fr-FR', long ? {day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'} : {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
}
function clean(v) { return String(v || '').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').trim(); }

/**
 * Traduit les messages d'erreur techniques bruts (toujours en anglais,
 * générés par le moteur JS lui-même) vers un texte compréhensible en
 * français. S'il ne reconnaît pas le message, le renvoie tel quel
 * plutôt que d'inventer une traduction approximative — préférable à un
 * texte français qui masquerait une info utile au diagnostic.
 */
function translateErrorMessage(msg) {
    if (!msg) return msg;
    const raw = String(msg).trim();
    const rules = [
        [/^([\w$.]+) is not defined$/, (m) => `Erreur technique interne (élément manquant : « ${m[1]} »). Merci de signaler ce message au support.`],
        [/^Cannot read propert(?:y|ies) '([^']+)' of (null|undefined)$/, (m) => `Erreur technique interne (donnée manquante : « ${m[1]} »). Merci de signaler ce message au support.`],
        [/^Cannot read propert(?:y|ies) of (null|undefined) \(reading '([^']+)'\)$/, (m) => `Erreur technique interne (donnée manquante : « ${m[2]} »). Merci de signaler ce message au support.`],
        [/^([\w$.]+) is not a function$/, (m) => `Erreur technique interne (fonction indisponible : « ${m[1]} »). Merci de signaler ce message au support.`],
        [/^Unexpected token .* in JSON/i, () => 'Réponse du serveur illisible. Réessayez dans un instant.'],
        [/^JSON\.parse/i, () => 'Réponse du serveur illisible. Réessayez dans un instant.'],
        [/^(Failed to fetch|Load failed|NetworkError when attempting to fetch resource\.?|A network error occurred\.?)$/i, () => 'Connexion au serveur impossible. Vérifiez votre connexion internet et réessayez.'],
        [/^The operation was aborted\.?$/i, () => 'Opération interrompue. Réessayez.'],
        [/^Invalid time value$/, () => 'Erreur technique interne (date invalide). Merci de signaler ce message au support.'],
        [/^The user aborted a request\.?$/i, () => 'Opération interrompue. Réessayez.'],
        [/^Quota exceeded\.?$/i, () => "Espace de stockage local plein sur cet appareil. Libérez de l'espace et réessayez."],
    ];
    for (const [pattern, translate] of rules) {
        const m = raw.match(pattern);
        if (m) return translate(m);
    }
    return raw; // Message non reconnu : on le garde tel quel, sans le déformer.
}

const KEYS = { history: 'oracle_history_v2', logs: 'oracle_logs_v2', permission: 'oracle_geo_permission_v2', outbox: 'oracle_sync_outbox_v2', errors: 'oracle_admin_errors_v1', adminLogs: 'oracle_admin_logs_v1', syncQueue: 'oracle_sync_queue_v1' };
const SYNC_STATE_KEY = 'oracle_sync_state_v1';
const SYNC_EVENTS_KEY = 'oracle_sync_status_events_v1';
let syncState = load(SYNC_STATE_KEY, {
    status: 'unknown',
    pendingCount: 0,
    lastConfirmedAt: null,
    lastAttemptAt: null,
    nextRetryAt: null,
    lastError: null
});
let syncStatusEvents = load(SYNC_EVENTS_KEY, []);

function saveSyncState() { save(SYNC_STATE_KEY, syncState); }
function recordSyncStatusTransition(nextStatus, detail = '') {
    if (!nextStatus || nextStatus === syncState.status) return;
    syncStatusEvents = [{
        status: nextStatus,
        detail: detail || syncStatusLabel(nextStatus),
        at: new Date().toISOString()
    }, ...syncStatusEvents].slice(0, 20);
    save(SYNC_EVENTS_KEY, syncStatusEvents);
}
function updateSyncState(patch, rerender = true) {
    if (patch.status && patch.status !== syncState.status) {
        recordSyncStatusTransition(patch.status, patch.lastError || syncStatusLabel(patch.status));
    }
    syncState = { ...syncState, ...patch };
    saveSyncState();
    if (rerender && page === 'home') render();
}

function syncStatusLabel(status) {
    return {
        up_to_date: 'À jour',
        syncing: 'Mise à jour…',
        update_available: 'Mise à jour disponible',
        pending: 'Éléments en attente',
        offline: 'Hors connexion',
        server_unreachable: 'Serveur injoignable',
        session_expired: 'Session à renouveler',
        rate_limited: 'Reprise différée',
        unknown: 'État non vérifié'
    }[status] || 'État non vérifié';
}

function syncStatusColor(status) {
    if (status === 'up_to_date') return 'var(--green)';
    if (status === 'syncing' || status === 'update_available' || status === 'pending') return 'var(--orange)';
    if (status === 'offline' || status === 'unknown') return 'var(--muted)';
    return 'var(--orange-deep)';
}

function getDashboardSyncSecondary(stats) {
    if (stats.status === 'syncing') return stats.pending ? `${stats.pending} élément${stats.pending > 1 ? 's' : ''} en traitement` : 'Mise à jour en cours';
    if (stats.status === 'update_available') return stats.pending ? `${stats.pending} fiche${stats.pending > 1 ? 's' : ''} à recevoir` : 'Mise à jour disponible';
    if (stats.status === 'offline') return 'Données conservées localement';
    if (stats.status === 'server_unreachable') return `Dernière confirmation : ${formatDashboardAge(stats.lastTimestamp).replace('MAJ : ', '')}`;
    if (stats.status === 'session_expired') return 'Reconnectez-vous pour reprendre';
    if (stats.status === 'rate_limited') return 'Nouvelle tentative automatique prévue';
    if (stats.pending) return `${stats.pending} élément${stats.pending > 1 ? 's' : ''} en attente`;
    return formatDashboardAge(stats.lastTimestamp);
}

function getLastSyncTransitionLabel() {
    const event = syncStatusEvents[0];
    if (!event || !event.at) return '';
    return `Statut modifié ${new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' }).format(new Date(event.at))}`;
}

function renderSyncStatusCard(stats, options = {}) {
    const isBusy = ['syncing', 'update_available'].includes(stats.status);
    const title = stats.pending && !['syncing', 'server_unreachable', 'offline', 'session_expired'].includes(stats.status)
        ? `${stats.pending} en attente`
        : syncStatusLabel(stats.status);
    const secondary = getDashboardSyncSecondary(stats);
    const fontSize = stats.status === 'server_unreachable' || stats.status === 'session_expired' ? '16' : stats.status === 'syncing' ? '18' : '21';
    return `<div class="stat sync-status-card" style="padding:16px;border:1px solid ${isBusy ? '#f0b987' : 'var(--line)'};border-radius:12px;background:${isBusy ? 'linear-gradient(145deg,#fffdf8,#fff1e6)' : 'var(--card)'};cursor:pointer;box-shadow:${isBusy ? '0 5px 16px rgba(238,123,61,.08)' : 'none'}" data-page="sync-status" aria-label="État de la synchronisation">
        <p style="display:flex;align-items:center;gap:5px;color:var(--muted);font-size:9px;font-weight:700;margin:0"><span style="width:26px;height:26px;display:inline-grid;place-items:center;border-radius:50%;color:${isBusy ? 'var(--orange)' : 'var(--muted)'};background:${isBusy ? '#fde7d5' : '#eef0ee'}"><i data-lucide="refresh-cw" style="width:14px;height:14px"></i></span> Synchronisation</p>
        <strong style="display:flex;align-items:center;gap:5px;margin-top:12px;font-size:${fontSize}px;color:${syncStatusColor(stats.status)}">${isBusy ? '<span class="sync-card-spinner" aria-hidden="true"></span>' : ''}${title}</strong>
        <small style="color:#9ba5ad;font-size:8px;display:block;margin-top:7px">${secondary}</small>
        ${['server_unreachable', 'offline', 'session_expired', 'rate_limited'].includes(stats.status) && getLastSyncTransitionLabel() ? `<small style="color:#b8a99f;font-size:7px;display:block;margin-top:4px">${getLastSyncTransitionLabel()}</small>` : ''}
    </div>`;
}
let history = load(KEYS.history, []);
let logs = load(KEYS.logs, []);
let permission = localStorage.getItem(KEYS.permission) === 'granted' ? 'granted' : 'prompt';

/**
 * Vérifie la VRAIE permission actuelle auprès du navigateur — jamais le
 * simple souvenir en localStorage, qui reste "accordée" pour toujours une
 * fois écrit, même si l'OS a retiré l'accès depuis (Android réinitialise
 * automatiquement les autorisations des apps peu utilisées — une cause
 * réelle et déjà observée de ce décalage). Retourne 'granted', 'denied',
 * ou 'prompt' — jamais un souvenir périmé.
 */
async function checkLiveGeoPermission() {
    if (!navigator.permissions || !navigator.permissions.query) return null; // API non supportée : on garde le comportement précédent
    try {
        const status = await navigator.permissions.query({ name: 'geolocation' });
        return status.state; // 'granted' | 'denied' | 'prompt'
    } catch (e) {
        return null;
    }
}

/** Réagit immédiatement si la permission est retirée PENDANT que l'app
 *  est déjà ouverte (pas seulement au démarrage) — l'agent n'a pas besoin
 *  de recharger la page pour que le modal réapparaisse. */
function watchLivePermissionChanges() {
    if (!navigator.permissions || !navigator.permissions.query) return;
    navigator.permissions.query({ name: 'geolocation' }).then(status => {
        status.onchange = () => {
            if (status.state !== 'granted') {
                permission = 'prompt';
                localStorage.removeItem(KEYS.permission);
                renderPermission("La localisation a été désactivée (dans les réglages du téléphone ou du navigateur). Elle est requise pour continuer.", true);
            }
        };
    }).catch(() => {});
}

const INSTALL_KEYS = { installed: 'oracle_pwa_installed', lastPrompt: 'oracle_install_prompt_last', tracked: 'oracle_install_tracked_v1', clientId: 'oracle_install_client_id_v1' };

/** Identifiant stable généré UNE SEULE fois, indépendamment de toute
 *  tentative d'envoi réussie ou non — sert de clé d'idempotence côté
 *  serveur. Contrairement à INSTALL_KEYS.tracked (qui ne garantissait
 *  rien : un simple échec réseau APRÈS que le serveur ait déjà
 *  enregistré la ligne suffisait à le réinitialiser et à provoquer un
 *  doublon), cet identifiant ne bouge jamais une fois créé : peu importe
 *  combien de fois "appinstalled" se déclenche ou échoue côté client,
 *  le serveur reconnaît toujours la même installation. */
function getOrCreateInstallClientId() {
    let cid = localStorage.getItem(INSTALL_KEYS.clientId);
    if (!cid) {
        cid = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2)));
        localStorage.setItem(INSTALL_KEYS.clientId, cid);
    }
    return cid;
}
const INSTALL_COOLDOWN_MS = 3 * 24 * 60 * 60 * 1000;
let deferredInstallPrompt = null;

function isInstalled() {
    return localStorage.getItem(INSTALL_KEYS.installed) === '1' ||
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;
}

function canInstall() {
    return !!deferredInstallPrompt && !isInstalled();
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    renderChrome();
    maybeShowInstallInvite();
});

window.addEventListener('appinstalled', () => {
    localStorage.setItem(INSTALL_KEYS.installed, '1');
    deferredInstallPrompt = null;
    document.getElementById('modal-root').innerHTML = '';
    renderChrome();
    toast('Oracle installé', 'L’application est maintenant disponible hors ligne.', 'success');

    // Traçabilité de l'installation — IP/session capturées côté serveur,
    // détails de l'appareil fournis ici (non sensibles, purement
    // informatifs : ne bloque jamais l'app si l'appel échoue).
    //
    // Chrome/Android peut déclencher "appinstalled" plus d'une fois pour
    // une même installation (comportement déjà observé, lié à la
    // génération du WebAPK confirmée séparément par les services Google
    // Play, quelques secondes après le premier déclenchement) — sans ce
    // garde-fou, chaque déclenchement créerait une ligne en base pour ce
    // qui n'est, pour l'utilisateur, qu'une seule et même installation.
    // L'idempotence est désormais garantie CÔTÉ SERVEUR par clientInstallId
    // (contrainte unique en base) — plus besoin d'un drapeau local fragile
    // pour éviter les doublons : on peut appeler trackInstall() à chaque
    // déclenchement de "appinstalled" (il peut légitimement se déclencher
    // plusieurs fois pour une même installation) sans jamais créer de
    // ligne en double, même en cas d'échec réseau sur un appel précédent.
    if (window.AuthAPI) {
        AuthAPI.trackInstall({
            clientInstallId: getOrCreateInstallClientId(),
            platform: navigator.platform || navigator.userAgentData?.platform || '',
            deviceModel: navigator.userAgentData?.mobile ? 'mobile' : (navigator.userAgentData?.platform || ''),
            language: navigator.language || '',
            screen: `${screen.width}x${screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || ''
        }).catch(() => {});
    }
});

window.triggerInstall = async function() {

        // sur Android/Chrome, instructions manuelles sur iPhone).
        location.href = '/installer';

class AnattTokenManager {
    constructor() { this.token = null; this.expiresAt = 0; this.pending = null; }
    async getToken() {
        if (this.token && Date.now() < this.expiresAt) return this.token;
        if (this.pending) return this.pending;
        this.pending = this.fetchToken().then(t => { this.token = t; this.expiresAt = Date.now() + CONFIG.TOKEN_TTL; return t; }).finally(() => { this.pending = null; });
        return this.pending;
    }
    async fetchToken() {
        const targetUrl = CONFIG.BASE_URL + CONFIG.IMMAT_URL;
        const proxyUrl = CONFIG.PROXY_URL + encodeURIComponent(targetUrl);
        const resp = await fetch(proxyUrl, { headers: { Accept: 'text/html,application/xhtml+xml' } });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const html = await resp.text();
        const match = html.match(/name=["']_token["'][^>]*value=["']([^"']+)/i) || html.match(/value=["']([^"']+)["'][^>]*name=["']_token["']/i);
        if (!match) throw new Error('Token non trouvé');
        return match[1];
    }
    invalidate() { this.token = null; this.expiresAt = 0; }
}

class AnattClient {
    constructor() {
        this.tokens = new AnattTokenManager();
        this.memory = new Map();
    }

    async verifierChassis(vin) {
        const normalized = String(vin || '').trim().toUpperCase();
        if (!/^[A-Z0-9]{15,17}$/.test(normalized)) {
            throw new Error('Le châssis doit contenir 15 à 17 caractères.');
        }

        const cached = this.fromCache(normalized);
        if (cached) return cached;

        let lastError = null;
        for (let attempt = 1; attempt <= CONFIG.MAX_RETRIES; attempt++) {
            try {
                const token = await this.tokens.getToken();
                const params = new URLSearchParams({ _token: token, search_type: 'chassis', search: normalized });
                const targetUrl = CONFIG.BASE_URL + CONFIG.SEARCH_URL + '?' + params.toString();
                const proxyUrl = CONFIG.PROXY_URL + encodeURIComponent(targetUrl);
                
                const resp = await fetch(proxyUrl, { 
                    headers: { Accept: 'text/html,application/xhtml+xml' },
                    signal: AbortSignal.timeout(20000)
                });

                if (resp.status === 419) { this.tokens.invalidate(); throw new Error('Session expirée'); }
                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const html = await resp.text();

                if (/Aucune donnée trouvée|Aucun enregistrement trouvé|Aucun résultat/i.test(html)) {
                    return null;
                }

                const result = this.parse(html, normalized);
                if (result) {
                    this.toCache(normalized, result);
                    return result;
                }

                if (/Page Expired|CSRF token mismatch/i.test(html)) {
                    this.tokens.invalidate();
                    throw new Error('Token invalide');
                }

                addLog('Recherche via N° Châssis ' + normalized, 'error', 'Impossible d\'extraire les données', { 
                    vin: normalized, 
                    htmlLength: html.length,
                    attempt: attempt,
                    preview: html.slice(0, 500)
                });
                throw new Error('Format de réponse inattendu');

            } catch (error) {
                lastError = error;
                addLog('Recherche via N° Châssis ' + normalized, 'error', error.message, { 
                    vin: normalized, 
                    attempt: attempt,
                    maxRetries: CONFIG.MAX_RETRIES
                });
                if (attempt < CONFIG.MAX_RETRIES) {
                    await new Promise(r => setTimeout(r, CONFIG.RETRY_DELAY * attempt));
                    this.tokens.invalidate();
                }
            }
        }
        throw new Error(lastError ? lastError.message : 'Service indisponible');
    }

    parse(html, expected) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const fullText = (doc.body ? doc.body.textContent : '').replace(/\s+/g, ' ').trim();

        const blocks = fullText
            .split(/Informations\s+Personn?elles/i)
            .map(b => b.trim())
            .filter(Boolean);

        const grabField = (block, label, stopLabels) => {
            const stop = stopLabels.concat('$').join('|');
            const re = new RegExp(label + '\\s*:\\s*([\\s\\S]*?)(?=\\s*(?:' + stop + '))', 'i');
            const m = block.match(re);
            return m ? m[1].replace(/\s+/g, ' ').trim() : '';
        };

        const records = blocks.map(block => ({
            owner: grabField(block, 'Nom\\s*&\\s*Pr[ée]nom', ['Moto\\s*&', 'N°?\\s*Ch[âa]ssis']),
            chassis: grabField(block, 'Ch[âa]ssis', ['Immatriculation']),
            plate: grabField(block, 'Immatriculation', ['D[ée]partement']),
            department: grabField(block, 'D[ée]partement', ['Action', 'Rendez-vous', 'T[ée]l[ée]charg'])
        })).filter(r => r.chassis || r.owner);

        if (!records.length) return null;

        const matches = records.filter(r => r.chassis &&
            (r.chassis === expected || r.chassis.includes(expected) || expected.includes(r.chassis)));
        const relevant = matches.length ? matches : records;

        const [current, ...previous] = relevant;
        return {
            status: 'found',
            owner: current.owner || 'Propriétaire non spécifié',
            plate: current.plate || '',
            department: current.department || '',
            isConsistent: true,
            message: 'Correspondance confirmée.',
            previousOwners: previous.map(p => ({
                owner: p.owner || 'Non spécifié',
                plate: p.plate || '',
                department: p.department || ''
            }))
        };
    }

    fromCache(vin) {
        const mem = this.memory.get(vin);
        if (mem && Date.now() - mem.at < CONFIG.CACHE_TTL) return mem.data;
        const cache = load(CONFIG.CACHE_KEY, {});
        const item = cache[vin];
        if (item && Date.now() - item.at < CONFIG.CACHE_TTL) {
            this.memory.set(vin, item);
            return item.data;
        }
        return null;
    }

    toCache(vin, data) {
        const item = { data, at: Date.now() };
        this.memory.set(vin, item);
        const cache = load(CONFIG.CACHE_KEY, {});
        cache[vin] = item;
        const keys = Object.keys(cache).sort((a,b) => cache[a].at - cache[b].at);
        keys.slice(0, keys.length - 100).forEach(k => delete cache[k]);
        save(CONFIG.CACHE_KEY, cache);
    }
}

let gpsWatchId = null;
let lastGps = { latitude: null, longitude: null, accuracy: null, samples: 0, timestamp: null };

// ================================================================
// SIGNAL GPS DÉGRADÉ — distinct de l'autorisation. Le modal bloquant
// ne couvre qu'un seul problème : l'autorisation du SITE n'a jamais
// été accordée (navigator.permissions.query). Il ne détecte PAS le cas,
// pourtant très courant sur le terrain, où cette autorisation est bien
// accordée mais où le téléphone lui-même ne peut fournir aucune
// position (service de localisation désactivé dans les réglages
// rapides Android, "Haute précision" désactivée, intérieur sans WiFi
// scanné...). Dans ce cas navigator.geolocation échoue avec
// POSITION_UNAVAILABLE (code 2), jamais PERMISSION_DENIED (code 1) —
// le modal ne se redéclenche donc jamais, et les recherches
// continuent d'être enregistrées, silencieusement, sans coordonnées.
// ================================================================
const GPS_STREAK_KEY = 'oracle_gps_fail_streak_v1';
const GPS_STREAK_THRESHOLD = 2; // dès la 2e recherche consécutive sans position

function getGpsFailStreak() { return Number(localStorage.getItem(GPS_STREAK_KEY) || 0); }
function resetGpsFailStreak() { localStorage.setItem(GPS_STREAK_KEY, '0'); renderGpsBanner(); }
function bumpGpsFailStreak() { localStorage.setItem(GPS_STREAK_KEY, String(getGpsFailStreak() + 1)); renderGpsBanner(); }

/** Bandeau discret, NON bloquant (contrairement au modal d'autorisation) :
 *  le dashboard reste utilisable, mais le message reste visible sur
 *  toutes les pages tant que le problème n'est pas résolu — recréé à
 *  chaque render() plutôt que fermable définitivement, pour la même
 *  raison que le modal ne propose pas de "plus tard". */
function renderGpsBanner() {
    const root = document.getElementById('gps-banner-root');
    if (!root) return;
    const streak = getGpsFailStreak();
    if (streak < GPS_STREAK_THRESHOLD || permission !== 'granted') { root.innerHTML = ''; return; }
    root.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff4d8;border-bottom:1px solid #f0d78a;color:#7a5a0c;font-size:10px;font-weight:700">
            <i data-lucide="map-pin-off" style="width:16px;height:16px;flex-shrink:0"></i>
            <span style="flex:1">Position introuvable sur ${streak} recherche${streak > 1 ? 's' : ''} d'affilée. L'autorisation du site est bien accordée — vérifiez que la <b>localisation est activée dans les réglages de votre téléphone</b> (pas seulement dans le navigateur), puis réessayez.</span>
        </div>
    `;
    lucide.createIcons();
}

// ================================================================
// VERROU D'ÉCRAN — empêche la mise en veille tant que l'app est
// ouverte, uniquement en mode PWA installée (standalone). Le verrou
// est automatiquement relâché par le système dès que l'onglet perd le
// focus ; on le redemande donc à chaque retour au premier plan.
// ================================================================

let wakeLock = null;

function isStandalonePwa() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

async function requestWakeLock() {
    if (!('wakeLock' in navigator) || !isStandalonePwa()) return;
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {
        // Best effort : refusé par le système (économie de batterie,
        // permission...) — l'app continue de fonctionner normalement.
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLock === null) requestWakeLock();
});

function startGpsBackground() {
    if (!navigator.geolocation) return;
    if (gpsWatchId !== null) return;
    gpsWatchId = navigator.geolocation.watchPosition(
        pos => {
            const c = pos.coords;
            if (![c.latitude, c.longitude, c.accuracy].every(Number.isFinite)) return;
            lastGps = {
                latitude: Number(c.latitude.toFixed(6)),
                longitude: Number(c.longitude.toFixed(6)),
                accuracy: Number(c.accuracy.toFixed(1)),
                samples: lastGps.samples + 1,
                timestamp: Date.now()
            };
            updateGpsIndicator(true);
        },
        err => { updateGpsIndicator(false); },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
    );
}

function getBestGps() {
    // Fenêtre de réutilisation resserrée : une position doit être à la
    // fois récente (<45s) et précise (≤20m) pour être réutilisée telle
    // quelle, sinon on relance une capture fraîche.
    if (lastGps.timestamp && Date.now() - lastGps.timestamp < 45000 && lastGps.accuracy != null && lastGps.accuracy <= 20) {
        return { ...lastGps };
    }
    return { latitude: null, longitude: null, accuracy: null, samples: 0 };
}

function captureGpsSilent() {
    return new Promise(resolve => {
        if (!navigator.geolocation) return resolve({ latitude: null, longitude: null, accuracy: null, samples: 0, error: 'Géolocalisation indisponible', errorCode: 'unsupported' });

        const cached = getBestGps();
        if (cached.latitude && cached.accuracy !== null && cached.accuracy <= 20) {
            return resolve({ ...cached, source: 'cache' });
        }

        // Deux passes, pas une seule : le GPS satellite pur (haute
        // précision) ne capte souvent RIEN à l'intérieur d'un bâtiment,
        // quel que soit le temps qu'on lui laisse — ce n'est pas un
        // problème de délai, c'est un problème de ligne de vue vers le
        // ciel. Plusieurs recherches d'affilée toutes sans position,
        // étalées sur plusieurs minutes, pointent vers ce cas précis
        // plutôt qu'un simple démarrage lent. On tente d'abord la haute
        // précision (GPS), et seulement si elle ne capte STRICTEMENT
        // rien, on retente en position approximative (Wi-Fi/antennes
        // relais) — nettement moins précise, mais qui fonctionne
        // justement là où le GPS pur échoue.
        attempt(true).then(result => {
            if (result.best) return resolve(finalizeSuccess(result));
            attempt(false).then(fallback => {
                if (fallback.best) return resolve(finalizeSuccess(fallback, 'network'));
                const code = fallback.errorCode || result.errorCode || 'timeout';
                const reasons = { permission_denied: 'Autorisation refusée', position_unavailable: 'Signal GPS introuvable, y compris en position approximative', timeout: 'Délai dépassé (aucun signal, GPS et réseau confondus)' };
                resolve({ latitude: null, longitude: null, accuracy: null, samples: result.samples + fallback.samples, error: 'Aucune position GPS', errorCode: code, errorLabel: reasons[code] || 'Cause inconnue', source: 'watch' });
            });
        });

        function finalizeSuccess(result, source = 'watch') {
            lastGps = { ...result.best, samples: result.samples, timestamp: Date.now() };
            updateGpsIndicator(true);
            return { ...result.best, samples: result.samples, source };
        }

        /** Une passe de capture — haute précision (GPS) ou approximative
         *  (réseau), selon highAccuracy. Résout toujours (jamais de rejet)
         *  avec { best, samples, errorCode }. */
        function attempt(highAccuracy) {
            return new Promise(res => {
                let best = null, samples = 0, done = false, lastErrorCode = null;
                // Sans dernière position connue, un premier essai en haute
                // précision peut légitimement prendre un peu plus de temps
                // (démarrage à froid) — modestement plus long, pas
                // démesuré : au-delà, c'est l'environnement (intérieur) qui
                // est en cause, pas juste la lenteur du premier point.
                const isColdStart = !lastGps || !lastGps.latitude;
                const timeout = highAccuracy ? (isColdStart ? 15000 : 9000) : 6000;
                const targetAccuracy = highAccuracy ? 8 : 150;
                const minSamples = highAccuracy && !isColdStart ? 3 : 1;

                const watch = navigator.geolocation.watchPosition(
                    p => {
                        const c = p.coords;
                        if (![c.latitude, c.longitude, c.accuracy].every(Number.isFinite)) return;
                        samples++;
                        if (!best || c.accuracy < best.accuracy) {
                            best = { latitude: Number(c.latitude.toFixed(6)), longitude: Number(c.longitude.toFixed(6)), accuracy: Number(c.accuracy.toFixed(1)) };
                        }
                        if (best.accuracy <= targetAccuracy && samples >= minSamples) finish();
                    },
                    e => {
                        // code 1 = PERMISSION_DENIED, 2 = POSITION_UNAVAILABLE
                        // (signal introuvable), 3 = TIMEOUT.
                        lastErrorCode = e.code === 1 ? 'permission_denied' : e.code === 2 ? 'position_unavailable' : 'timeout';
                        if (e.code === 1) {
                            // Retiré PENDANT que l'app tournait déjà : le
                            // modal bloquant réapparaît immédiatement, pas
                            // besoin d'attendre la fin des deux passes.
                            permission = 'prompt';
                            localStorage.removeItem(KEYS.permission);
                            renderPermission("La localisation a été désactivée (dans les réglages du téléphone ou du navigateur). Elle est requise pour continuer.", true);
                            finish();
                        } else {
                            finish();
                        }
                    },
                    { enableHighAccuracy: highAccuracy, maximumAge: highAccuracy ? 0 : 60000, timeout: timeout + 1000 }
                );

                setTimeout(() => { if (!lastErrorCode) lastErrorCode = 'timeout'; finish(); }, timeout);

                function finish() {
                    if (done) return;
                    done = true;
                    navigator.geolocation.clearWatch(watch);
                    res({ best, samples, errorCode: lastErrorCode });
                }
            });
        }
    });
}

function updateGpsIndicator(active) {
    const el = document.getElementById('gps-indicator');

/** Détecte plateforme + navigateur pour proposer le bon chemin de
 *  réglages quand la géolocalisation a été bloquée durablement — sans
 *  ça, l'agent ne sait pas où chercher pour la réactiver. */
function detectGeoSettingsPath() {
    const ua = navigator.userAgent;
    const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /android/i.test(ua);
    const isChrome = /chrome|crios/i.test(ua) && !/edg|opr/i.test(ua);
    const isSafari = /safari/i.test(ua) && !/chrome|crios|android/i.test(ua);
    const isFirefox = /firefox|fxios/i.test(ua);

    if (isIOS && isSafari) {
        return { label: 'iPhone · Safari', steps: [
            'Ouvrez <b>Réglages</b> sur votre iPhone',
            'Allez dans <b>Confidentialité et sécurité → Service de localisation</b>',
            'Activez le service, cherchez <b>Safari</b> dans la liste et autorisez-le',
            'Revenez sur Oracle et rechargez la page'
        ]};
    }
    if (isIOS) {
        return { label: 'iPhone', steps: [
            'Ouvrez <b>Réglages → Confidentialité et sécurité → Service de localisation</b>',
            'Trouvez votre navigateur dans la liste et autorisez la position',
            'Revenez sur Oracle et rechargez la page'

                    <i data-lucide="${blocked ? 'refresh-cw' : 'locate-fixed'}" style="width:18px;height:18px"></i> ${blocked ? "J'ai activé la position — réessayer" : 'Autoriser la localisation'}
                </button>
                <small style="display:block;margin-top:12px;color:#9ba5ad;font-size:8px">Vous pouvez modifier à tout moment dans les paramètres</small>

async function requestPermission() {
    if (!navigator.geolocation) {
        renderPermission('La géolocalisation n\'est pas disponible sur ce terminal.');
        return;
    }
    const btn = document.getElementById('grant-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span> Autorisation en cours…';

    navigator.geolocation.getCurrentPosition(
        pos => {
            localStorage.setItem(KEYS.permission, 'granted');
            permission = 'granted';
            document.getElementById('permission-root').innerHTML = '';
            startGpsBackground();
            render();
            toast('Position activée', 'Oracle peut désormais tracer vos contrôles.', 'success');
        },
        async err => {
            if (err.code === 1) {
                const live = await checkLiveGeoPermission();
                renderPermission(
                    live === 'denied'
                        ? 'Autorisation bloquée au niveau du navigateur. Suivez les étapes ci-dessous pour la réactiver.'
                        : 'Autorisation refusée. Réessayez, ou suivez les étapes ci-dessous si le bouton ne fonctionne plus.',
                    true
                );
            } else {
                renderPermission('Position momentanément indisponible. Réessayez.');
                setTimeout(() => { renderPermission(null); }, 3000);
            }
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

// ================================================================
// NORMALISATION IMMATRICULATION
// ================================================================
// Formats plaques béninoises acceptés :
//   1 chiffre + 2 lettres + 4 chiffres + RB   (ex. 2CR0770RB)
//   2 lettres + 4 chiffres + RB                (ex. AA0770RB)
const PLATE_CORE_RE = /^([0-9]?[A-Z]{2}[0-9]{4})(RB)?$/;

function normalizePlateInput(raw) {
    return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function completePlate(raw) {
    const stripped = normalizePlateInput(raw);
    const m = stripped.match(PLATE_CORE_RE);
    if (!m) return null;
    return m[1] + 'RB';
}

function isValidVin(raw) {
    const v = String(raw || '').replace(/\s/g, '').toUpperCase();
    return /^[A-Z0-9]{15,17}$/.test(v);
}

function endsWithRB(raw) {
    return /RB$/i.test(String(raw || '').replace(/\s/g, ''));
}

// ================================================================
// RECHERCHE PAR CHÂSSIS
// ================================================================

function scrollToResultCard() {
    setTimeout(() => {
        const el = document.getElementById('result-card');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
}

// Cherche la zone de résultat / le bouton actifs, qu'on soit sur la
// page Recherche (formulaires dédiés) ou sur le dashboard (barre
// unique) — permet de lancer une recherche depuis l'accueil sans
// jamais changer de page.
function getActiveResultBox() {
    return document.getElementById('search-result') || document.getElementById('home-search-result');
}
function clearActiveSearchInputs() {
    ['vin', 'immat-input', 'home-vin'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.value = '';
        el.readOnly = false;
        el.classList.remove('locked');
        const wrap = el.closest('.oracle-input-wrap');
        if (wrap) wrap.classList.remove('locked', 'valid');
        el.dispatchEvent(new Event('input'));
    });
}

async function runSearch(vin) {
    const dedicatedSubmit = document.getElementById('search-submit');
    const submit = dedicatedSubmit || document.getElementById('home-search-btn');
    const isHomeContext = !dedicatedSubmit;
    const normalized = vin.toUpperCase().trim();
    const resultBox = getActiveResultBox();
    
    if (!normalized || normalized.length < 15) {
        toast('Châssis invalide', '15 caractères minimum requis.', 'error');
        return;
    }

    if (submit) {
        submit.disabled = true;
        submit.innerHTML = isHomeContext ? '<span class="loading-spinner"></span>' : '<span class="loading-spinner"></span> Vérification…';
    }

    try {
        const gps = await captureGpsSilent();
        if (gps.latitude != null) resetGpsFailStreak(); else bumpGpsFailStreak();

        let data;
        try {
            const remote = await client.verifierChassis(normalized);
            if (remote) {
                data = { ...remote, status: 'found', fromCache: false };
                addLog('Recherche via N° Châssis ' + normalized, 'success', 'Châssis identifié', { vin: normalized });
            } else {
                data = { status: 'not_found', message: 'Aucune donnée trouvée pour ce châssis.', fromCache: false };
                addLog('Recherche via N° Châssis ' + normalized, 'warning', 'Châssis non trouvé', { vin: normalized });
            }
        } catch (error) {
            // La vérification en direct est TOUJOURS tentée en premier
            // (ci-dessus) — c'est ça, "online-first". Mais si elle échoue,
            // quelle que soit la raison (hors ligne, proxy en panne,
            // timeout...), on se rabat sur le registre local avant
            // d'afficher quoi que ce soit à l'agent : une donnée locale,
            // même un peu ancienne, reste plus utile sur le terrain qu'un
            // "indisponible" sec.
            const cached = await resolveFromCache(normalized, 'vin');
            if (cached.current) {
                data = {
                    status: 'found',
                    ...mapCachedRecordToResult(cached.current),
                    fromCache: true,
                    message: 'Correspondance trouvée dans le registre local (vérification en direct indisponible).',
                    previousOwners: cached.previousOwners.map(p => ({ ...mapCachedRecordToResult(p) }))
                };
                addLog('Recherche via N° Châssis ' + normalized, 'warning', 'Résultat issu du registre local (vérification en direct indisponible)', { vin: normalized });
            } else if (!cached.confirmed) {
                // Absent du miroir LOCAL, mais jamais confirmé par le
                // serveur — la synchro de cet appareil n'est peut-être pas
                // terminée. Dire "introuvable" ici induirait l'agent en
                // erreur sur un véhicule qui existe peut-être bien.
                data = {
                    status: 'unavailable',
                    message: "Aucune correspondance dans les données déjà présentes sur cet appareil — sans connexion, impossible de confirmer si ce véhicule existe réellement ou si sa fiche n'est pas encore synchronisée ici. Réessayez une fois en ligne.",
                    fromCache: false
                };
                addLog('Recherche via N° Châssis ' + normalized, 'warning', 'Introuvable dans le miroir local (synchro possiblement incomplète), pas confirmé', { vin: normalized });
            } else {
                data = {
                    status: 'unavailable',
                    message: translateErrorMessage(error.message) || 'Service momentanément indisponible.',
                    fromCache: false
                };
                addLog('Recherche via N° Châssis ' + normalized, 'error', 'Vérification en direct indisponible et rien en local', { vin: normalized });
            }
        }

        if (data.status === 'found' && !data.fromCache) {
            await maybeRegisterDiscovery({ status: data.status, owner: data.owner, plate: data.plate, department: data.department, vin: normalized, fromCache: false });
        }

        const record = {
            ...data,
            id: id(),
            searchType: 'chassis',
            searchKey: normalized,
            vin: normalized,
            searchedAt: new Date().toISOString(),
            latitude: gps.latitude,
            longitude: gps.longitude,
            accuracy: gps.accuracy,
            samples: gps.samples || 0
        };

        // Une recherche sans aucune coordonnée doit toujours laisser une
        // trace exploitable — avant ce correctif, cette information
        // existait dans le code mais n'était jamais consignée nulle part,
        // rendant tout diagnostic a posteriori impossible.
        if (!gps.latitude && gps.errorCode) {
            addLog('Position non obtenue', 'warning', `Recherche châssis enregistrée sans coordonnées — ${gps.errorLabel || gps.errorCode}.`, { errorCode: gps.errorCode, vin: normalized });
        }

        history = [record, ...history];
        save(KEYS.history, history);
        if (window.AuthAPI) {
            AuthAPI.syncSearch(record).then(result => {
                if (!result) {
                    queueSyncItem('search', record);
                    const failure = AuthAPI.lastSyncError || { status: 0, message: 'Échec inconnu.' };
                    addLog('Synchronisation recherche', 'error', `Recherche non envoyée au serveur : ${failure.message}`, { httpStatus: failure.status || 'réseau', recordId: record.id });
                }
            });
        }

        if (resultBox) resultBox.innerHTML = buildResult(record);
        scrollToResultCard();
        clearActiveSearchInputs();
        
        if (record.status === 'found') {
            toast('Châssis identifié', 'Correspondance confirmée.', 'success');
        } else if (record.status === 'not_found') {
            toast('Recherche enregistrée', 'Le résultat a été conservé.', 'info');
        } else {
            toast('Service indisponible', 'La recherche sera synchronisée plus tard.', 'error');
        }

        await syncPending();

    } catch (error) {
        addLog('Recherche via N° Châssis ' + normalized, 'error', translateErrorMessage(error.message) || 'Erreur inconnue', { vin: normalized });
        toast('Erreur', translateErrorMessage(error.message) || 'Une erreur est survenue.', 'error');
    } finally {
        if (submit) {
            submit.innerHTML = isHomeContext ? '<i data-lucide="search" style="width:20px;height:20px"></i>' : '<i data-lucide="search"></i> Rechercher';
            const inputEl = document.getElementById(isHomeContext ? 'home-vin' : 'vin');
            const val = inputEl ? inputEl.value : '';
            submit.disabled = isHomeContext ? !(isValidVin(val) || !!completePlate(val)) : !isValidVin(val);
            lucide.createIcons();
        }
    }
}

function buildResult(r) {
    const isFound = r.status === 'found';
    const isImmat = r.searchType === 'immatriculation';
    const foundLabel = isImmat ? 'Immatriculation identifiée' : 'Châssis identifié';
    const notFoundLabel = isImmat ? 'Immatriculation introuvable' : 'Aucun enregistrement trouvé';
    const keyLabel = isImmat ? 'Immatriculation' : 'Châssis';
    const keyValue = isImmat ? (r.immatriculation || r.searchKey) : r.vin;

    // L'ordre des champs suit la clé utilisée pour la recherche : la clé
    // recherchée apparaît toujours en premier, l'autre identifiant en
    // troisième position — jamais l'inverse.
    const primaryLabel = isImmat ? 'Immatriculation' : 'Châssis';
    const primaryValue = isImmat ? (r.plate || r.immatriculation || r.searchKey || '—') : (r.vin || r.searchKey || '—');
    const secondaryLabel = isImmat ? 'Châssis' : 'Immatriculation';
    const secondaryValue = isImmat ? (r.vin || '—') : (r.plate || '—');
    // Seul le châssis bénéficie de la police à chasse fixe (utile pour
    // distinguer précisément I/l/1, O/0 sur un VIN) — l'immatriculation et
    // le nom sont plus courts/lisibles en police normale. Le texte peut
    // s'étaler sur plusieurs lignes : jamais de troncature (ellipsis) sur
    // un nom de propriétaire, qui doit rester entièrement lisible.
    const fields = [
        [primaryLabel, primaryValue, !isImmat && primaryLabel === 'Châssis'],
        ['Propriétaire', r.owner || '—', false],
        [secondaryLabel, secondaryValue, isImmat && secondaryLabel === 'Châssis'],
        ['Département', r.department || '—', false]
    ];

    // Le bouton "Anciens propriétaires" (quand il existe) est isolé sur
    // sa propre ligne pleine largeur, au-dessus des deux autres — sinon
    // sur 3 colonnes il pousse "Voir la position" hors de l'écran.
    const hasPreviousOwners = r.previousOwners && r.previousOwners.length;
    const footerButtons = [
        { label: 'Nouvelle recherche', icon: 'plus', cls: 'secondary', onclick: 'window.oracleNewSearch()' }
    ];
    if (r.latitude != null) {
        footerButtons.push({ label: 'Voir la position', icon: 'map', cls: 'primary', onclick: `window.openGoogleMap('${r.id}')`, extra: 'background:linear-gradient(150deg,#f6a25f,var(--orange))' });
    }

    return `
        <section class="result" id="result-card" style="margin-top:20px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow);overflow:hidden;border-left:4px solid ${isFound ? 'var(--green)' : r.status === 'not_found' ? 'var(--yellow)' : 'var(--red)'}">
            <div style="padding:20px 24px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
                <span style="width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border-radius:var(--r-sm);background:${isFound ? 'var(--green-soft)' : r.status === 'not_found' ? '#fdf1da' : '#fbe6e1'};color:${isFound ? 'var(--green)' : r.status === 'not_found' ? '#9c6a0c' : 'var(--red)'}">
                    <i data-lucide="${isFound ? 'check-circle-2' : r.status === 'not_found' ? 'search' : 'alert-triangle'}" style="width:21px;height:21px"></i>
                </span>
                <div style="flex:1;min-width:0">
                    <p class="eyebrow" style="margin-bottom:4px;color:var(--muted);font-size:8px">${fmt(r.searchedAt)}</p>
                    <h3 style="margin:0;font:19px/1 Manrope,sans-serif;font-weight:800">${isFound ? foundLabel : r.status === 'not_found' ? notFoundLabel : 'Service indisponible'}</h3>
                </div>
                <span class="badge ${isFound ? 'success' : r.status === 'not_found' ? 'warning' : 'danger'}"><i></i>${isFound ? 'Identifié' : r.status === 'not_found' ? 'Introuvable' : 'Indisponible'}</span>
            </div>
            <div style="padding:0 24px">
                ${isFound ? `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:18px 0;border-top:1px solid #efede7;border-bottom:1px solid #efede7" class="result-data">
                        ${fields.map(([label, value, mono]) => `
                            <div><span style="color:var(--muted);font-size:10px;display:block">${label}</span><b style="margin-top:5px;font-size:15px;display:block;line-height:1.35;word-break:break-word;${mono ? 'font-family:ui-monospace,monospace;letter-spacing:.03em' : ''}">${value}</b></div>
                        `).join('')}
                    </div>
                ` : `
                    <p style="padding:18px 0;border-top:1px solid #efede7;border-bottom:1px solid #efede7;color:var(--muted);font-size:13px;line-height:1.65;margin:0">
                        Le numéro <b>${keyValue}</b> ${r.status === 'not_found' ? "n'a pas été retrouvé dans les données accessibles." : "n'a pas pu être vérifié."}
                        La tentative a bien été conservée dans votre historique.
                    </p>
                `}
            </div>
            <div style="padding:16px 24px;border-top:1px solid #efede7;background:#fbfaf6">
                <div style="display:flex;align-items:center;gap:5px;color:var(--muted);font-size:9px;margin-bottom:11px"><i data-lucide="shield-check" style="width:14px;height:14px"></i> Enregistré localement · ${r.samples || 0} mesure(s)</div>
                ${hasPreviousOwners ? `<button class="secondary" onclick="window.showPreviousOwners('${r.id}')" style="font-size:10px;width:100%;justify-content:center;margin-bottom:8px"><i data-lucide="history" style="width:14px;height:14px"></i> ${r.previousOwners.length > 1 ? 'Anciens propriétaires' : 'Ancien propriétaire'}</button>` : ''}
                <div style="display:grid;grid-template-columns:repeat(${footerButtons.length},1fr);gap:8px">
                    ${footerButtons.map(b => `<button class="${b.cls}" onclick="${b.onclick}" style="font-size:10px;width:100%;justify-content:center;${b.extra || ''}"><i data-lucide="${b.icon}" style="width:14px;height:14px"></i> ${b.label}</button>`).join('')}
                </div>
            </div>
        </section>
    `;
}

window.oracleNewSearch = () => { page = 'search'; render(); };

window.openGoogleMap = function openGoogleMap(id) {
    const r = history.find(x => x.id === id);
    if (!r || r.latitude == null || r.longitude == null) {

        return;

    window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.latitude + ',' + r.longitude), '_blank', 'noopener');
}

let leafletMap = null;
let leafletMarkers = [];
// null => utilise l'historique local de l'appareil (comportement par
// défaut, et vue "Mes positions" pour l'admin). Un tableau => données
// chargées depuis le serveur (vue admin "Toutes les positions" ou un
// utilisateur spécifique).
let mapDataSource = null;

function markerColorFor(status) {
    return status === 'found' ? '#1ea873' : status === 'not_found' ? '#efad22' : '#e45a43';
}

function renderMap() {
    const el = document.getElementById('map-canvas');
    if (!el) return;

    // Indispensable : Leaflet marque le nœud DOM lui-même (_leaflet_id) à
    // l'initialisation. Comme le même élément #map-canvas est réutilisé à
    // chaque rendu (changement d'agent, retour sur la page...), vider son
    // HTML ne suffit pas — sans .remove() sur l'ancienne instance, Leaflet
    // refuse la réinitialisation avec "Map container is already
    // initialized" dès le deuxième appel.
    if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
    }

    const positions = (mapDataSource || history).filter(r => r.latitude != null && r.longitude != null);
    if (!positions.length) {
        el.innerHTML = `<div class="empty" style="height:100%;display:grid;place-items:center"><p style="color:var(--muted);font-size:11px"><i data-lucide="map-pin" style="width:24px;height:24px;display:block;margin:0 auto 8px"></i>Aucune position enregistrée</p></div>`;
        lucide.createIcons();
        return;
    }

    el.innerHTML = '';
    leafletMap = L.map(el, { zoomControl: true, attributionControl: false })
        .setView([positions[0].latitude, positions[0].longitude], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMap);

    leafletMarkers = positions.map(r => {
        const icon = L.divIcon({
            className: '',
            html: `<span style="display:block;width:18px;height:18px;border-radius:50%;background:${markerColorFor(r.status)};border:2.5px solid #fffdf9;box-shadow:0 2px 8px rgba(0,0,0,.4)"></span>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });
        const marker = L.marker([r.latitude, r.longitude], { icon }).addTo(leafletMap);
        const key = r.searchKey || r.vin || r.immatriculation || '—';
        const ownerLabel = r.status === 'found' ? (r.owner || 'Propriétaire non spécifié') : (r.status === 'not_found' ? 'Introuvable' : 'Indisponible');
        marker.bindTooltip(`<b style="font-family:ui-monospace,monospace">${key}</b><br>${ownerLabel}`, { direction: 'top', offset: [0, -10], opacity: 0.95 });
        marker.on('click', () => {
            const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.latitude + ',' + r.longitude);
            L.popup({ closeButton: true, maxWidth: 220 })
                .setLatLng([r.latitude, r.longitude])
                .setContent(`<div style="font-family:Manrope,sans-serif;font-size:11px"><b style="font-family:ui-monospace,monospace;display:block;margin-bottom:3px">${key}</b><span style="color:#73808c;display:block;margin-bottom:6px">${ownerLabel} · ${fmt(r.searchedAt, true)}</span><a href="${mapsUrl}" target="_blank" rel="noopener" style="color:var(--orange-deep);font-weight:700;text-decoration:none">Ouvrir dans Maps ↗</a></div>`)
                .openOn(leafletMap);
        });
        return marker;
    });

    if (positions.length > 1) {
        leafletMap.fitBounds(L.latLngBounds(positions.map(r => [r.latitude, r.longitude])), { padding: [40, 40] });
    }

    const legend = document.createElement('div');
    legend.style.cssText = 'position:absolute;left:12px;bottom:12px;z-index:500;display:flex;gap:10px;padding:6px 10px;border-radius:8px;background:#fffdf9e8;box-shadow:0 5px 18px #1e2d3b1f;font-size:7px;font-weight:700;pointer-events:none';
    legend.innerHTML = `
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1ea873;margin-right:4px"></span>Identifié</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#efad22;margin-right:4px"></span>Introuvable</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#e45a43;margin-right:4px"></span>Indisponible</span>
    `;
    el.appendChild(legend);
    lucide.createIcons();
}

let adminMapSelection = 'self';
let adminMapUsersForSelector = null;
let adminMapAgentSearch = '';

function renderAdminMapSelectorCards() {
    const currentUser = AuthAPI.getCurrentUser();
    const users = (adminMapUsersForSelector && adminMapUsersForSelector.users) || [];
    const others = users.filter(u => !currentUser || u.id !== currentUser.id);
    const total = adminMapUsersForSelector ? adminMapUsersForSelector.total : users.length;

    const fixedCards = [
        { key: 'self', icon: 'user', label: 'Mes positions', sub: 'Vos recherches sur cet appareil' },
        { key: 'all', icon: 'globe', label: 'Toutes les positions', sub: `${total} utilisateur${total > 1 ? 's' : ''} au total, vous compris` },
    ];
    const fixedHtml = fixedCards.map(c => `
        <button class="admin-map-card ${adminMapSelection === c.key ? 'active' : ''}" data-map-select="${c.key}">
            <span class="admin-map-card-icon"><i data-lucide="${c.icon}"></i></span>
            <span class="admin-map-card-text"><b>${c.label}</b><span>${c.sub}</span></span>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--muted)"></i>
        </button>
    `).join('');

    // À 150 000 agents, afficher une carte par utilisateur (comme avant)
    // rendrait la page inutilisable — des dizaines de milliers de nœuds
    // DOM d'un coup. À la place : un champ de recherche, et seulement les
    // quelques résultats correspondants (jamais la liste entière) tant
    // que rien n'est tapé.
    const query = adminMapAgentSearch.trim().toLowerCase();
    const MAX_RESULTS = 8;
    let matches = [];
    if (query) {
        matches = others.filter(u =>
            `${u.prenoms || ''} ${u.nom || ''}`.toLowerCase().includes(query) ||
            (u.email || '').toLowerCase().includes(query) ||
            (u.matricule || '').toLowerCase().includes(query)
        );
    }
    const shown = matches.slice(0, MAX_RESULTS);
    const hiddenCount = Math.max(0, matches.length - MAX_RESULTS);

    const searchHtml = `
        <div style="position:relative;margin-top:4px">
            <i data-lucide="search" style="width:14px;height:14px;position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)"></i>
            <input type="text" id="admin-map-agent-search" placeholder="Chercher un agent précis (nom, e-mail, matricule)…" value="${adminMapAgentSearch.replace(/"/g,'&quot;')}" style="width:100%;padding:10px 12px 10px 32px;border:1px solid var(--line);border-radius:9px;font-size:11px;font-family:inherit">
        </div>
    `;

    const resultsHtml = !query
        ? `<p style="color:var(--muted);font-size:9px;margin:8px 2px 0">Tapez un nom, un e-mail ou un matricule pour retrouver un agent précis.</p>`
        : shown.length
            ? shown.map(u => `
                <button class="admin-map-card ${adminMapSelection === u.id ? 'active' : ''}" data-map-select="${u.id}">
                    <span class="admin-map-card-icon"><i data-lucide="user"></i></span>
                    <span class="admin-map-card-text"><b>${(u.prenoms || '') + ' ' + (u.nom || '')}</b><span>${u.email}</span></span>
                    <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--muted)"></i>
                </button>
            `).join('') + (hiddenCount ? `<p style="color:var(--muted);font-size:9px;margin:4px 2px 0">+ ${hiddenCount} autre${hiddenCount > 1 ? 's' : ''} résultat${hiddenCount > 1 ? 's' : ''} — affinez la recherche pour les voir.</p>` : '')
            : `<p style="color:var(--muted);font-size:9px;margin:8px 2px 0">Aucun agent ne correspond à « ${adminMapAgentSearch} ».</p>`;

    return fixedHtml + searchHtml + `<div style="display:grid;gap:8px;margin-top:8px">${resultsHtml}</div>`;
}

function wireAdminMapSelectorCards() {
    document.querySelectorAll('[data-map-select]').forEach(b => b.onclick = () => selectAdminMapSource(b.dataset.mapSelect));
    const searchInput = document.getElementById('admin-map-agent-search');
    if (searchInput) {

let adminUsersCache = null;

function getDashboardSyncStats() {
    const queue = load(KEYS.syncQueue, []);
    const immatQueue = load(IMMAT_PENDING_KEY, []);
    const pending = queue.length + immatQueue.length;
    const attempts = [...queue, ...immatQueue]
        .map(item => item.createdAt ? new Date(item.createdAt).getTime() : 0)
        .filter(Boolean);
    const cursor = loadSyncCursor();
    const lastTimestamp = attempts.length
        ? Math.max(...attempts)
        : (cursor.since && cursor.since !== '1970-01-01 00:00:00' ? new Date(toIso(cursor.since)).getTime() : 0);
    const statePending = Number(syncState.pendingCount || 0);
    return {
        pending: Math.max(pending, statePending),
        lastTimestamp: syncState.lastConfirmedAt ? new Date(syncState.lastConfirmedAt).getTime() : lastTimestamp,
        status: syncState.status,
        lastError: syncState.lastError,
        nextRetryAt: syncState.nextRetryAt
    };
}

function formatDashboardAge(timestamp) {
    if (!timestamp || !Number.isFinite(timestamp)) return 'Aucune synchronisation enregistrée';
    const minutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
    if (minutes < 1) return 'MAJ : à l’instant';
    if (minutes < 60) return `MAJ : il y a ${minutes} min`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `MAJ : il y a ${hours} h`;
    return `MAJ : ${fmt(new Date(timestamp).toISOString())}`;
}

const PAGE_SIZE = 20;
let paginationState = { history: 1, logs: 1, errors: 1, errorDetail: 1, users: 1, adminLogs: 1 };
let filterState = {
    history: { query: '', status: null, dateFrom: '', dateTo: '' },
    logs: { query: '', status: null, dateFrom: '', dateTo: '' }
};

function paginate(list, key) {
    const page = paginationState[key] || 1;
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    const clampedPage = Math.min(page, totalPages);
    if (clampedPage !== page) paginationState[key] = clampedPage;
    const start = (clampedPage - 1) * PAGE_SIZE;
    return { items: list.slice(start, start + PAGE_SIZE), page: clampedPage, totalPages, total: list.length };
}

function renderPaginationBar(key, page, totalPages) {
    if (totalPages <= 1) return '';
    return `
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding-top:14px">
            <button class="secondary" data-page-nav="${key}" data-page-dir="-1" ${page <= 1 ? 'disabled' : ''} style="font-size:10px;padding:8px 12px"><i data-lucide="chevron-left" style="width:14px;height:14px"></i></button>
            <span style="font-size:10px;color:var(--muted);min-width:90px;text-align:center">Page ${page} / ${totalPages}</span>
            <button class="secondary" data-page-nav="${key}" data-page-dir="1" ${page >= totalPages ? 'disabled' : ''} style="font-size:10px;padding:8px 12px"><i data-lucide="chevron-right" style="width:14px;height:14px"></i></button>
        </div>
    `;
}

function bindPaginationNav() {
    document.querySelectorAll('[data-page-nav]').forEach(btn => {
        btn.onclick = () => {
            const key = btn.dataset.pageNav;
            paginationState[key] = (paginationState[key] || 1) + Number(btn.dataset.pageDir);
            // Utilisateurs/Erreurs se rendent via un panneau admin séparé
            // (déjà en cache) — inutile de redéclencher tout le routeur

            if (key === 'users' || key === 'errors' || key === 'errorDetail' || key === 'adminLogs') renderAdminPanel();
            else render();
        };
    });
}

/** Recherche texte unique : nom du propriétaire, châssis, immatriculation. */
function matchesQuery(record, query) {
    if (!query.trim()) return true;
    const q = query.trim().toLowerCase();
    const haystack = [record.owner, record.searchKey, record.vin, record.plate, record.message, record.type]
        .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
}

function matchesDateRange(dateStr, from, to) {
    if (!dateStr) return !from && !to;
    const t = new Date(dateStr).getTime();
    if (from && t < new Date(from + 'T00:00:00').getTime()) return false;
    if (to && t > new Date(to + 'T23:59:59').getTime()) return false;
    return true;
}

function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
