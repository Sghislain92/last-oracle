window.recenterMap = function recenterMap() {
    if (!leafletMap || !leafletMarkers.length) return;
    if (leafletMarkers.length === 1) {
        leafletMap.setView(leafletMarkers[0].getLatLng(), 15);
    } else {
        const bounds = L.latLngBounds(leafletMarkers.map(m => m.getLatLng()));
        leafletMap.fitBounds(bounds, { padding: [40, 40] });
    }
};

function wire() {
    document.querySelectorAll('[data-page]').forEach(b => {
        if (b.closest('#drawer')) return; // le tiroir gère ses propres liaisons dans openDrawer()
        b.onclick = () => {
            page = b.dataset.page;
            render();
            closeDrawer();
        };
    });

    bindPaginationNav();
    if (page === 'history') bindFilterBar('history');
    if (page === 'logs') bindFilterBar('logs');

    if (page === 'search') {
        const tabImmat=document.getElementById('tab-immat'), tabVin=document.getElementById('tab-vin');
        const panelImmat=document.getElementById('panel-immat'), panelVin=document.getElementById('panel-vin');
        const immatInput=document.getElementById('immat-input'), immatForm=document.getElementById('form-immat'), immatSubmit=document.getElementById('immat-submit');
        const vinInput=document.getElementById('vin'), vinForm=document.getElementById('form-vin'), submit=document.getElementById('search-submit');

        const activate = mode => {
            const immat=mode==='immat';
            tabImmat.classList.toggle('active',immat); tabVin.classList.toggle('active',!immat);
            tabImmat.setAttribute('aria-selected',immat); tabVin.setAttribute('aria-selected',!immat);
            panelImmat.classList.toggle('active',immat); panelVin.classList.toggle('active',!immat);
            setTimeout(()=>(immat?immatInput:vinInput).focus(),50);
        };
        tabImmat.onclick=()=>activate('immat'); tabVin.onclick=()=>activate('vin');

        // Comportement du bouton immatriculation IDENTIQUE au bouton
        // châssis : désactivé tant que le format n'est pas valide.
        immatInput.oninput = () => {
            const raw = immatInput.value.toUpperCase();
            immatInput.value = raw;
            const wrap = immatInput.closest('.oracle-input-wrap');
            const plate = completePlate(raw);
            const ready = !!plate;
            immatSubmit.disabled = !ready;
            wrap.classList.toggle('valid', ready);
            const locked = endsWithRB(raw) && ready;
            wrap.classList.toggle('locked', locked);
            immatInput.readOnly = locked;
            document.getElementById('immat-ready').innerHTML = ready
                ? '<span class="ready"><i data-lucide="check-circle-2" style="width:12px;height:12px;display:inline"></i> Prêt à rechercher</span>'
                : '';
            lucide.createIcons();
        };
        immatInput.onkeydown = e => { if (e.key === 'Enter' && !immatSubmit.disabled) immatForm.requestSubmit(); };
        immatForm.onsubmit = e => { e.preventDefault(); runImmatSearch(immatInput.value); };

        if (vinInput) {
            vinInput.oninput = () => {
                vinInput.value = vinInput.value.replace(/\s/g, '').toUpperCase().slice(0, 17);
                document.getElementById('vin-count').textContent = vinInput.value.length;
                submit.disabled = vinInput.value.length < 15 || vinInput.value.length > 17;
                vinInput.closest('.oracle-input-wrap').classList.toggle('valid', vinInput.value.length >= 15);
            };
            vinInput.onkeydown = e => { if (e.key === 'Enter' && !submit.disabled) vinForm.requestSubmit(); };
        }
        if (vinForm) vinForm.onsubmit = e => { e.preventDefault(); runSearch(vinInput.value); };
    }
    if (page === 'home') {
        const input = document.getElementById('home-vin');
        const btn = document.getElementById('home-search-btn');
        if (input && btn) {
            const update = () => {
                let val = input.value.toUpperCase();
                const plate = completePlate(val);
                const locked = endsWithRB(val) && !!plate;
                input.readOnly = locked;
                input.classList.toggle('locked', locked);
                val = val.replace(/\s/g, '').length > 17 && !plate ? val.slice(0, 17) : val;
                input.value = val;
                btn.disabled = !(isValidVin(val) || !!plate);
            };
            input.oninput = update;
            input.onkeydown = e => { if (e.key === 'Enter' && !btn.disabled) runSearchFromHome(); };
            btn.onclick = runSearchFromHome;
        }
    }
}

const VALID_HASH_PAGES = ['home', 'search', 'history', 'positions', 'sync-status', 'logs', 'errors', 'guide', 'about', 'admin-users'];
const initialHashPage = location.hash.replace(/^#/, '');
if (VALID_HASH_PAGES.includes(initialHashPage)) page = initialHashPage;

const isInstallLandingPath = /\/installer\/?$/.test(location.pathname);
if (isInstallLandingPath) {
    renderInstallLanding();
} else if (window.AuthAPI && AuthAPI.isAuthenticated()) {
    (async () => {
        // Vérifie la VRAIE permission actuelle avant de faire confiance au
        // souvenir en localStorage — corrige le cas où l'OS l'a retirée
        // entre-temps (Android réinitialise automatiquement les
        // autorisations des apps peu utilisées) sans que l'app ne l'ait
        // jamais su. C'est ce qui laissait passer des recherches sans
        // aucune coordonnée GPS, silencieusement, sans jamais remontrer
        // le modal.
        const live = await checkLiveGeoPermission();
        if (live && live !== 'granted' && permission === 'granted') {
            permission = 'prompt';
            localStorage.removeItem(KEYS.permission);
        }

        if (permission !== 'granted') {
            renderPermission(null);
        } else {
            startGpsBackground();
            render();
            loadDashboardAdminStats();
            watchLivePermissionChanges();
        }
        if (permission === 'granted') {
            document.getElementById('permission-root').innerHTML = '';
        }
    })();

    // Le registre est désormais chargé fragment par fragment, à la
    // demande, au fil des recherches — plus de préchargement global au
    // démarrage (inutile et coûteux avec un registre de grande taille).
    syncPendingImmatriculations();
    syncPendingSearchesAndLogs();
    restoreServerData();
    syncRegistryDelta();
    requestWakeLock();
} else {
    page = 'login';
    render();
}

window.onerror = (msg, url, line) => {
    console.error('Oracle error:', msg, url, line);
    const translated = translateErrorMessage(msg) || 'Erreur inconnue';
    addLog('Erreur globale', 'error', translated, { url, line });
    const isAuth = window.AuthAPI && AuthAPI.isAuthenticated();
    toast('Erreur', isAuth ? 'Une erreur inattendue est survenue. Consultez l\'onglet Erreurs.' : 'Une erreur inattendue est survenue. Réessayez.', 'error');
};

// Une erreur survenant dans une fonction async (await ... sans try/catch,
// ou une Promise jamais interceptée) ne déclenche PAS window.onerror —
// sans ce filet, ces erreurs restent invisibles, ni loguées ni
// affichées, ce qui rend le diagnostic impossible.
window.addEventListener('unhandledrejection', (event) => {
    const reason = event.reason;
    const rawMsg = (reason && reason.message) ? reason.message : String(reason || 'Erreur inconnue');
    console.error('Oracle unhandled rejection:', reason);
    const translated = translateErrorMessage(rawMsg) || 'Erreur inconnue';
    addLog('Erreur globale (promesse)', 'error', translated, { stack: reason && reason.stack ? String(reason.stack).slice(0, 500) : undefined });
    const isAuth = window.AuthAPI && AuthAPI.isAuthenticated();
    toast('Erreur', isAuth ? 'Une erreur inattendue est survenue. Consultez l\'onglet Erreurs.' : 'Une erreur inattendue est survenue. Réessayez.', 'error');
});

console.log('Oracle v6.5 — recherche unifiée immat/châssis');
