// ================================================================
// IMPORT EN MASSE — upload .txt (type CSV) ou .json, parsé côté
// client, fusionné côté serveur en un seul commit GitHub.
// ================================================================

function parseImportLine(line, separator) {
    const out = [];
    let value = '', quoted = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"' && line[i + 1] === '"') { value += '"'; i++; }
        else if (c === '"') { quoted = !quoted; }
        else if (c === separator && !quoted) { out.push(value.trim()); value = ''; }
        else { value += c; }
    }
    out.push(value.trim());
    return out;
}

/** Convertit le contenu d'un .txt (format tableur : en-têtes + lignes,
 *  séparateur , ou ;) en tableau de fiches au schéma standard. */
// Reconnaît n'importe quelle variante raisonnable de nom de colonne
// (accents, underscores/espaces, casse) : "nom_et_prenom", "Nom Et Prénom",
// "NOM-ET-PRENOM"... tout devient "nom et prenom" pour la comparaison.
function normalizeFieldKey(k) {
    return String(k || '')
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2') // sépare le camelCase ("nomPrenom" -> "nom Prenom") AVANT la mise en minuscule
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // retire les accents
        .replace(/[_\-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}
function buildNormalizedRow(row) {
    const byKey = {};
    Object.keys(row).forEach(k => { byKey[normalizeFieldKey(k)] = row[k]; });
    const pick = (...keys) => {
        for (const k of keys) { if (byKey[k] !== undefined && byKey[k] !== null && String(byKey[k]).trim()) return String(byKey[k]).trim(); }
        return '';
    };
    return {
        'nom et prénom': pick('nom et prenom', 'nom prenom', 'nom prenoms', 'proprietaire', 'owner', 'nom'),
        immatriculation: pick('immatriculation', 'plate', 'plaque'),
        'département': pick('departement', 'department'),
        'châssis': pick('chassis', 'vin'),
        statut: pick('statut', 'status') || 'OK',
        source: pick('source') || 'import'
    };
}

function parseTxtToRecords(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return { records: [], skipped: [] };
    const separator = lines[0].includes(';') ? ';' : ',';
    const headers = parseImportLine(lines.shift(), separator).map(h => h.replace(/^\uFEFF/, '').trim());
    // On envoie les lignes BRUTES (clés d'origine du fichier) au serveur —
    // buildNormalizedRow sert ICI uniquement à décider si la ligne contient
    // assez d'info pour être utile (filtre), jamais à transformer ce qui
    // est réellement envoyé. Ainsi, même si ce fichier côté client prend du
    // retard sur une future variante de colonnes, le serveur (normalisation
    // unique, un seul endroit à tenir à jour) reste la source de vérité et
    // peut toujours retrouver la donnée d'origine — elle n'est jamais
    // perdue avant même d'arriver jusqu'à lui.
    const records = [], skipped = [];
    lines.forEach(line => {
        const values = parseImportLine(line, separator);
        const row = Object.fromEntries(headers.map((h, i) => [h, values[i] || '']));
        const n = buildNormalizedRow(row);
        if (n['châssis'] || n['immatriculation']) records.push(row);
        else skipped.push(row);
    });
    return { records, skipped };
}

/** Renvoie { records, skipped } — skipped contient les lignes rejetées
 *  faute de châssis ET d'immatriculation exploitables (typiquement des
 *  lignes déjà vides à la source, statut "Erreur" d'un outil d'extraction
 *  tiers) — jamais silencieusement, toujours comptées et montrées à
 *  l'agent avant l'import. */
function parseJsonToRecords(text) {
    const parsed = JSON.parse(text);
    const rows = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.records) ? parsed.records : []);
    // Même principe : filtre local avec buildNormalizedRow, mais on envoie
    // les objets BRUTS au serveur, pas le résultat de la transformation.
    const records = [], skipped = [];
    rows.forEach(row => {
        const n = buildNormalizedRow(row);
        if (n['châssis'] || n['immatriculation']) records.push(row);
        else skipped.push(row);
    });
    return { records, skipped };
}

/** Modal de confirmation générique (remplace window.confirm natif, hors
 *  charte). Retourne une Promise<boolean> — résolue à true si l'utilisateur
 *  confirme, false s'il annule ou ferme le modal. */
function showConfirmModal({ title, message, confirmLabel = 'Confirmer', cancelLabel = 'Annuler', icon = 'help-circle', danger = false }) {
    return new Promise((resolve) => {
        const root = document.getElementById('modal-root');
        let settled = false;
        const finish = (value) => { if (settled) return; settled = true; root.innerHTML = ''; resolve(value); };
        root.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target===this) window.__confirmModalCancel()">
                <div class="modal-box" style="max-width:400px;text-align:center">
                    <span style="width:46px;height:46px;margin:0 auto 14px;display:grid;place-items:center;border-radius:var(--r-md);background:${danger ? '#fbe6e1' : 'var(--orange-soft)'};color:${danger ? 'var(--red)' : 'var(--orange-deep)'}">
                        <i data-lucide="${icon}" style="width:22px;height:22px"></i>
                    </span>
                    <h2 style="margin:0 0 8px;font:19px/1.2 Manrope,sans-serif;font-weight:800">${title}</h2>
                    <p style="margin:0 0 20px;color:var(--muted);font-size:12px;line-height:1.6">${message}</p>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                        <button class="secondary" id="confirm-modal-cancel" style="font-size:11px;width:100%;justify-content:center">${cancelLabel}</button>
                        <button class="${danger ? 'danger' : 'primary'}" id="confirm-modal-ok" style="font-size:11px;width:100%;justify-content:center;${danger ? '' : 'background:linear-gradient(150deg,#f6a25f,var(--orange))'}">${confirmLabel}</button>
                    </div>
                </div>
            </div>
        `;
        window.__confirmModalCancel = () => finish(false);
        document.getElementById('confirm-modal-cancel').onclick = () => finish(false);
        document.getElementById('confirm-modal-ok').onclick = () => finish(true);
        lucide.createIcons();
    });
}

async function handleAdminImportFile(file) {
    const statusEl = document.getElementById('admin-import-status');
    const btn = document.getElementById('admin-import-btn');
    const setStatus = (msg, isError) => { if (statusEl) { statusEl.textContent = msg; statusEl.style.color = isError ? 'var(--red)' : 'var(--muted)'; } };

    let records, skipped;
    try {
        const text = await file.text();
        const result = file.name.toLowerCase().endsWith('.json') ? parseJsonToRecords(text) : parseTxtToRecords(text);
        records = result.records;
        skipped = result.skipped;
    } catch (err) {
        setStatus('Fichier illisible : ' + (translateErrorMessage(err.message) || 'format invalide'), true);
        return;
    }

    if (!records.length && !skipped.length) {
        setStatus('Fichier vide.', true);
        return;
    }
    if (!records.length) {
        setStatus(`Aucune fiche exploitable dans ce fichier — ${skipped.length} ligne(s) sans châssis ni immatriculation (déjà vides à la source).`, true);
        addLog('Import registre immatriculations', 'warning', `Fichier « ${file.name} » : ${skipped.length} ligne(s) totalement vide(s) à la source (statut probable « Erreur » côté outil d'extraction), aucune fiche exploitable.`, { fichier: file.name, numerosIgnores: skipped.map(s => s.numero || s.numero === 0 ? s.numero : null).filter(v => v !== null) });
        return;
    }

    const confirmed = await showConfirmModal({
        title: 'Importer ce fichier ?',
        message: `${records.length} fiche(s) détectée(s)${skipped.length ? `, ${skipped.length} ligne(s) ignorée(s) (sans châssis ni immatriculation — déjà vides à la source)` : ''}. Elles seront fusionnées au registre existant (les doublons exacts seront ignorés, les fiches incomplètes complétées).`,
        confirmLabel: 'Lancer la fusion',
        icon: 'upload'
    });
    if (!confirmed) return;

    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Fusion en cours…'; }

    // Simple découpage par taille (plus besoin de trier par fragment —
    // MySQL gère tout en une seule transaction côté serveur, quel que
    // soit le nombre de véhicules concernés). Seule limite qui subsiste :
    // la taille d'une requête HTTP elle-même.
    const REQUEST_CAP = 3000;
    const batches = [];
    for (let i = 0; i < records.length; i += REQUEST_CAP) batches.push(records.slice(i, i + REQUEST_CAP));

    const totals = { added: 0, enriched: 0, skipped: 0, total: 0 };
    try {
        let completed = 0;
        for (const batch of batches) {
            setStatus(batches.length > 1 ? `Envoi… ${completed}/${batches.length} lot(s) traité(s).` : `Envoi de ${batch.length} fiche(s)…`);
            const partial = await AuthAPI.importImmatriculations(batch);
            totals.added += partial.added;
            totals.enriched += partial.enriched;
            totals.skipped += partial.skipped;
            totals.total = partial.total;
            completed++;
        }
        const result = totals;
        setStatus(`${result.added} ajoutée(s), ${result.enriched} enrichie(s), ${result.skipped} déjà à jour. Total registre : ${result.total}.`);
        toast('Import terminé', `${result.added} nouvelle(s) fiche(s), ${result.enriched} complétée(s).`, 'success');
        syncRegistryDelta(); // rend les nouvelles fiches cherchables hors ligne sans attendre le prochain cycle

        // Traçabilité explicite de chaque upload dans les Logs admin — le
        // nombre précédent se déduit du total renvoyé moins les fiches
        // effectivement ajoutées (les enrichies/ignorées ne changent pas
        // le nombre total de fiches, seul un ajout le fait).
        const previousTotal = result.total - result.added;
        addLog(
            'Import registre immatriculations',
            'success',
            `Upload de <b>${result.added}</b> nouvelle${result.added > 1 ? 's' : ''} entrée${result.added > 1 ? 's' : ''} sur <b>${previousTotal}</b> précédente${previousTotal > 1 ? 's' : ''}. Total : <b>${result.total}</b>.${skipped.length ? ` (${skipped.length} ligne(s) du fichier déjà vide(s) à la source, non importée(s).)` : ''}`,
            { fichier: file.name, ajoutees: result.added, enrichies: result.enriched, doublonsIgnores: result.skipped, lignesSourceVides: skipped.length, numerosLignesVides: skipped.map(s => s.numero).filter(v => v !== undefined), totalAvant: previousTotal, totalApres: result.total }
        );
        // Rafraîchit immédiatement le panneau admin en place (logs, total)
        // sans exiger de quitter la page puis d'y revenir.
        if (page === 'admin-users') loadAdminUsersData();
    } catch (err) {
        const progressNote = totals.added || totals.enriched ? ` (${totals.added} fiche(s) déjà importée(s) avant l'échec — pas de perte, les lots précédents sont déjà enregistrés)` : '';
        setStatus("Échec de l'import : " + (translateErrorMessage(err.message) || 'erreur inconnue') + progressNote, true);
        addLog('Import registre immatriculations', 'error', `Échec de l'upload du fichier « ${file.name} » : ${translateErrorMessage(err.message) || 'erreur inconnue'}.${progressNote}`, { fichier: file.name, ajouteesAvantEchec: totals.added, enrichiesAvantEchec: totals.enriched });
        toast("Échec de l'import", translateErrorMessage(err.message) || 'Erreur inconnue', 'error');
    } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i data-lucide="upload" style="width:14px;height:14px"></i> Choisir un fichier (.txt ou .json)'; lucide.createIcons(); }
    }
}

let adminAutoRefreshTimer = null;
const ADMIN_AUTO_REFRESH_MS = 20000; // 20s — réactif sans jamais s'approcher du seuil qui a déclenché le 429

function manageAdminAutoRefresh(shouldRun) {
    if (adminAutoRefreshTimer) { clearInterval(adminAutoRefreshTimer); adminAutoRefreshTimer = null; }
    if (!shouldRun) return;
    adminAutoRefreshTimer = setInterval(() => {
        // En pause si l'onglet est en arrière-plan (économie réseau/CPU
        // quand personne ne regarde vraiment l'écran) ou si une action
        // manuelle (import, changement de rôle) a déjà une requête en
        // cours — évite deux rafraîchissements qui se chevauchent.
        if (document.hidden || page !== 'admin-users') return;
        loadAdminUsersData();
    }, ADMIN_AUTO_REFRESH_MS);
}

// ================================================================
// PAGE "SYNCHRONISATION" — accessible à tous, pas seulement l'admin.
// Contrairement au panneau Administration, la mesure "déjà synchronisé"
// est une simple lecture LOCALE d'IndexedDB (aucun réseau, donc aucun
// risque de reproduire l'incident 429) — rafraîchissable très souvent.
// Seul le total du registre nécessite une requête réseau, bien plus
// espacée.
// ================================================================
let syncStatusAutoRefreshTimer = null;
const SYNC_STATUS_LOCAL_REFRESH_MS = 5000;   // lecture locale : peu coûteux, très réactif
const SYNC_STATUS_REMOTE_REFRESH_MS = 60000; // total serveur : une fois par minute suffit largement

function manageSyncStatusAutoRefresh(shouldRun) {
    if (syncStatusAutoRefreshTimer) { clearInterval(syncStatusAutoRefreshTimer); syncStatusAutoRefreshTimer = null; }
    if (!shouldRun) return;
    let ticks = 0;
    syncStatusAutoRefreshTimer = setInterval(() => {
        if (document.hidden || page !== 'sync-status') return;
        ticks++;
        // Le total serveur n'est redemandé qu'une fois sur 12 (~60s) —
        // le compte local, lui, à chaque tick (~5s), sans coût réseau.
        loadSyncStatusData(ticks % 12 === 0);
    }, SYNC_STATUS_LOCAL_REFRESH_MS);
}

function renderSyncStatusShell() {
    return `
        <div class="page-head">
            <div>
                <p class="eyebrow"><i data-lucide="refresh-cw" style="width:14px;height:14px;display:inline"></i> Registre local</p>
                <h1>État de la <em>synchronisation</em></h1>
                <p style="max-width:590px;margin:13px 0 0;color:var(--muted);font-size:13px;line-height:1.7">Combien de fiches sont déjà disponibles hors ligne sur cet appareil précis — mis à jour automatiquement, sans avoir à recharger la page.</p>
            </div>
        </div>
        <div id="sync-status-cards" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <div class="empty" style="grid-column:1/-1"><span class="loading-spinner" style="border-top-color:var(--orange)"></span></div>
        </div>
    `;
}

async function loadSyncStatusData(fetchRemoteTotal = true) {
    const container = document.getElementById('sync-status-cards');
    if (!container) return; // page quittée entre-temps
    try {
        const [synced, cursor] = await Promise.all([idbCount(), Promise.resolve(loadSyncCursor())]);
        let total = syncProgressState.total || 0;
        let serverLatestUpdatedAt = null;
        if (fetchRemoteTotal && navigator.onLine && window.AuthAPI && AuthAPI.isAuthenticated()) {
            try {
                const countResult = await AuthAPI.getRegistryCount();
                total = countResult.total || total;
                serverLatestUpdatedAt = countResult.latestUpdatedAt || null;
                syncProgressState.total = total;
                if (syncState.status !== 'syncing') updateSyncState({ status: 'up_to_date', lastConfirmedAt: new Date().toISOString(), lastError: null }, false);
            } catch (e) {
                updateSyncState({ status: 'server_unreachable', lastAttemptAt: new Date().toISOString(), lastError: e.message || 'Serveur injoignable' }, false);
            }
        } else if (!navigator.onLine) {
            updateSyncState({ status: 'offline', lastAttemptAt: new Date().toISOString() }, false);
        } else if (!window.AuthAPI || !AuthAPI.isAuthenticated()) {
            updateSyncState({ status: 'session_expired', lastAttemptAt: new Date().toISOString() }, false);
        }
        if (!document.getElementById('sync-status-cards')) return; // page quittée pendant l'attente réseau

        const remaining = Math.max(0, total - synced);
        const pct = total > 0 ? Math.min(100, Math.round((synced / total) * 100)) : 0;
        const lastSyncLabel = cursor.since && cursor.since !== '1970-01-01 00:00:00' ? fmt(toIso(cursor.since), true) : 'Jamais encore';
        const localCursorDate = cursor.since ? new Date(toIso(cursor.since)).getTime() : 0;
        const serverLatestDate = serverLatestUpdatedAt ? new Date(toIso(serverLatestUpdatedAt)).getTime() : 0;
        const serverHasNewerData = !!(localCursorDate && serverLatestDate && serverLatestDate > localCursorDate);
        const effectiveStatus = serverHasNewerData ? 'update_available' : syncState.status;

        document.getElementById('sync-status-cards').innerHTML = `
            <div style="grid-column:1/-1;padding:20px;border-radius:16px;background:linear-gradient(155deg,#1e2f3d,var(--ink-deep));color:#fff">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <span style="font-size:11px;font-weight:800;color:#f5a468">${pct}% du registre disponible hors ligne</span>
                    ${syncProgressState.syncing ? '<span style="display:flex;align-items:center;gap:5px;font-size:9px;color:#c7cfd6"><span class="loading-spinner" style="width:10px;height:10px;border-width:2px;border-top-color:var(--orange)"></span> Synchronisation en cours</span>' : ''}
                </div>
                <div style="height:10px;border-radius:99px;background:#ffffff22;overflow:hidden">
                    <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),#f5a468);border-radius:99px;transition:width .4s"></div>
                </div>
            </div>
            <div style="padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card)">
                <p style="margin:0;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Déjà synchronisées</p>
                <p style="margin:6px 0 0;font-family:'DM Serif Display',serif;font-size:28px">${synced.toLocaleString('fr-FR')}</p>
            </div>
            <div style="padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card)">
                <p style="margin:0;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Restantes</p>
                <p style="margin:6px 0 0;font-family:'DM Serif Display',serif;font-size:28px;color:${remaining > 0 ? 'var(--orange-deep)' : 'var(--green)'}">${remaining.toLocaleString('fr-FR')}</p>
            </div>
            <div style="grid-column:1/-1;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <span style="font-size:10px;color:var(--muted)"><i data-lucide="clock-3" style="width:12px;height:12px;display:inline;vertical-align:-2px"></i> Dernière donnée reçue : ${lastSyncLabel}</span>
                ${effectiveStatus === 'server_unreachable'
                    ? `<span style="font-size:10px;color:var(--orange-deep)">Serveur injoignable — dernière confirmation : ${formatDashboardAge(syncState.lastConfirmedAt ? new Date(syncState.lastConfirmedAt).getTime() : localCursorDate).replace('MAJ : ', '')}</span>`
                    : effectiveStatus === 'offline'
                        ? `<span style="font-size:10px;color:var(--muted)">Hors connexion — données conservées localement</span>`
                        : effectiveStatus === 'session_expired'
                            ? `<span style="font-size:10px;color:var(--orange-deep)">Session à renouveler</span>`
                            : remaining > 0 || serverHasNewerData
                                ? `<span style="font-size:10px;color:var(--orange-deep)">Mise à jour disponible — synchronisation en cours</span>`
                                : `<span class="badge success"><i></i>À jour</span>`}
            </div>
        `;
        lucide.createIcons();
    } catch (e) {
        if (container) container.innerHTML = `<div class="empty" style="grid-column:1/-1"><p style="color:var(--red);font-size:11px">${translateErrorMessage(e.message)}</p></div>`;
    }
}

async function loadAdminUsersData() {
    const panel = document.getElementById('admin-panel');
    if (!panel) return;
    try {
        const freshUsers = await AuthAPI.getUsers();
        adminUsersCache = { ...freshUsers, users: (freshUsers.users || []).map(mapUserRow) };
        const freshErrors = await AuthAPI.getErrors();
        adminErrorsCache = { ...freshErrors, errors: (freshErrors.errors || []).map(mapErrorRow) };
        save(KEYS.errors, adminErrorsCache);
        const freshLogs = await AuthAPI.getUserLogs('all');
        adminLogsCache = { ...freshLogs, logs: (freshLogs.logs || []).map(mapLogRow) };
        save(KEYS.adminLogs, adminLogsCache);
        // L'agent a pu quitter la page pendant ces requêtes (plusieurs
        // allers-retours réseau) — si on n'est plus sur "admin-users", tout
        // le DOM ciblé plus bas a déjà été remplacé par la page suivante.
        // Continuer plantait (Cannot set properties of null) en tentant de
        // recâbler des boutons qui n'existent plus.
        if (page !== 'admin-users') return;
        renderAdminPanel();
    } catch (err) {
        if (page !== 'admin-users') return;
        if (adminErrorsCache) {
            // Échec réseau, mais on a une version en cache (potentiellement
            // ancienne) — on l'affiche plutôt qu'un écran d'erreur sec, avec
            // un avertissement clair sur sa fraîcheur.
            renderAdminPanel();
            toast('Connexion indisponible', 'Erreurs affichées depuis la dernière synchronisation locale.', 'warning');
        } else {
            panel.innerHTML = `<div class="empty"><div class="empty-icon"><i data-lucide="alert-circle" style="width:24px;height:24px"></i></div><h3>Impossible de charger les données</h3><p>${translateErrorMessage(err.message)}</p></div>`;
            lucide.createIcons();
        }
    }
    const tabUsers = document.getElementById('admin-tab-users');
    const tabLogs = document.getElementById('admin-tab-logs');
    const tabErrors = document.getElementById('admin-tab-errors');
    if (!tabUsers || !tabLogs || !tabErrors) return; // page quittée entre-temps
    tabUsers.onclick = () => { adminActiveTab = 'users'; adminSelectedErrorEmail = null; paginationState.users = 1; render(); };
    tabLogs.onclick = () => { adminActiveTab = 'logs'; paginationState.adminLogs = 1; render(); };
    tabErrors.onclick = () => { adminActiveTab = 'errors'; adminSelectedErrorEmail = null; paginationState.errors = 1; render(); };
    const importBtn = document.getElementById('admin-import-btn');
    const importFileInput = document.getElementById('admin-import-file');
    if (importBtn && importFileInput) {
        importBtn.onclick = () => importFileInput.click();
        importFileInput.onchange = () => {
            if (importFileInput.files && importFileInput.files[0]) handleAdminImportFile(importFileInput.files[0]);
            importFileInput.value = '';
        };
    }
    const aiBtn = document.getElementById('admin-ai-insights-btn');
    if (aiBtn) {
        aiBtn.onclick = async () => {
            const resultBox = document.getElementById('admin-ai-insights-result');
            aiBtn.disabled = true;
            aiBtn.innerHTML = '<span class="loading-spinner" style="width:11px;height:11px;border-width:2px"></span> Génération…';
            try {
                const result = await AuthAPI.getAiInsights();
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<p style="white-space:pre-wrap">${result.summary}</p>${!result.aiUsed ? '<p style="color:var(--muted);font-size:9px;margin-top:6px">(clé IA non configurée — chiffres bruts affichés)</p>' : ''}`;
            } catch (e) {
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<p style="color:var(--red)">${translateErrorMessage(e.message)}</p>`;
            } finally {
                aiBtn.disabled = false;
                aiBtn.innerHTML = '<i data-lucide="sparkles" style="width:14px;height:14px"></i> Générer';
                lucide.createIcons();
            }
        };
    }
}

function renderAdminPanel() {
    const panel = document.getElementById('admin-panel');
    if (!panel) return;
    if (adminActiveTab === 'users') {
        panel.innerHTML = renderAdminUsersList();
        document.querySelectorAll('[data-admin-user]').forEach(b => b.onclick = () => window.showUserDetail(b.dataset.adminUser));
    } else if (adminActiveTab === 'logs') {
        panel.innerHTML = renderAdminLogsList();
    } else {
        panel.innerHTML = adminSelectedErrorEmail ? renderAdminErrorDetail(adminSelectedErrorEmail) : renderAdminErrorsList();
        const back = document.getElementById('admin-error-back');
        if (back) back.onclick = () => { adminSelectedErrorEmail = null; renderAdminPanel(); };
        document.querySelectorAll('[data-admin-error-email]').forEach(b => b.onclick = () => { adminSelectedErrorEmail = b.dataset.adminErrorEmail; paginationState.errorDetail = 1; renderAdminPanel(); });
    }
    bindPaginationNav();
    lucide.createIcons();
}

    const { items, page, totalPages } = paginate(users, 'users');
    return `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
            <p style="margin:0;font-size:11px;color:var(--muted)">Utilisateurs<br><strong style="font-size:24px;color:var(--ink);font-family:'DM Serif Display',serif">${adminUsersCache ? adminUsersCache.total : users.length}</strong></p>
        </div>
        <div class="admin-users-grid">

                <button class="admin-user-card" data-admin-user="${u.id}">

function renderAdminErrorsList() {

    const byEmail = {};
    errors.forEach(e => { (byEmail[e.email] = byEmail[e.email] || []).push(e); });
    const emails = Object.keys(byEmail).sort((a,b) => byEmail[b].length - byEmail[a].length);
    const { items, page, totalPages } = paginate(emails, 'errors');
    return `
        <div style="display:grid;gap:8px">
            ${items.length ? items.map(email => `
                <button class="admin-error-email-row" data-admin-error-email="${email}">
                    <span style="font-size:11px;font-weight:700">${email}</span>

/** Logs généraux (tous utilisateurs) — admin uniquement. Chaque entrée

    const users = (adminUsersCache && adminUsersCache.users) || [];
    const u = users.find(x => x.id === userId);
    return u ? { name: `${u.prenoms} ${u.nom}`, email: u.email } : { name: 'Utilisateur inconnu', email: userId || '—' };
}

window.changeUserRole = async function(userId, newRole) {
    const label = newRole === 'admin' ? 'promouvoir cet utilisateur administrateur' : 'rétrograder cet utilisateur en agent';
    const confirmed = await showConfirmModal({ title: 'Confirmer ce changement ?', message: `Vous allez ${label}. Cette action prend effet immédiatement.`, confirmLabel: 'Confirmer', icon: 'shield' });
    if (!confirmed) { window.showUserDetail(userId); return; } // remet le menu sur la vraie valeur (annulée)
    try {
        const result = await AuthAPI.updateUser(userId, { role: newRole });
        applyUpdatedUserToCache(result.user);
        // La liste derrière le modal doit refléter le changement dès la
        // fermeture, pas seulement après avoir quitté puis revenu sur la page.
        if (adminActiveTab === 'users') renderAdminPanel();
        toast('Rôle modifié', `L'utilisateur est maintenant ${newRole === 'admin' ? 'administrateur' : 'agent'}.`, 'success');
        window.showUserDetail(userId);
    } catch (e) {
        toast('Échec', translateErrorMessage(e.message) || 'Impossible de modifier le rôle.', 'error');
    }
};

window.toggleUserActive = async function(userId, newActive) {
    const confirmed = await showConfirmModal({
        title: newActive ? 'Réactiver ce compte ?' : 'Désactiver ce compte ?',
        message: newActive ? "L'utilisateur pourra de nouveau se connecter immédiatement." : "L'utilisateur ne pourra plus se connecter, et sa session en cours sera coupée à la prochaine requête.",
        confirmLabel: newActive ? 'Réactiver' : 'Désactiver',
        icon: newActive ? 'user-check' : 'user-x'
    });
    if (!confirmed) { window.showUserDetail(userId); return; } // remet le menu sur la vraie valeur (annulée)
    try {
        const result = await AuthAPI.updateUser(userId, { active: newActive });
        applyUpdatedUserToCache(result.user);
        if (adminActiveTab === 'users') renderAdminPanel();
        toast(newActive ? 'Compte réactivé' : 'Compte désactivé', '', 'success');
        window.showUserDetail(userId);
    } catch (e) {
        toast('Échec', translateErrorMessage(e.message) || 'Impossible de modifier le statut.', 'error');
    }
};

function applyUpdatedUserToCache(mappedRawUser) {
    if (!adminUsersCache || !mappedRawUser) return;
    const mapped = mapUserRow(mappedRawUser);
    const idx = adminUsersCache.users.findIndex(u => u.id === mapped.id);
    if (idx >= 0) adminUsersCache.users[idx] = mapped;
}

window.showUserLogsModal = async function(userId) {
    const modal = document.getElementById('modal-root');
    modal.innerHTML = `
        <div class="modal-overlay">
            <div class="modal-box" style="text-align:center">

function addLog(type, status, message, metadata) {
    const entry = { id: id(), createdAt: new Date().toISOString(), type, status, message, metadata };
    logs = [entry, ...logs].slice(0, 200);
    save(KEYS.logs, logs);
    // Le journal reste visible localement immédiatement. S'il n'y a pas
    // encore de session valide, on le met tout de même en file : après la
    // reconnexion, le serveur l'enregistrera dans tech_logs avec l'agent
    // réellement authentifié, sans demander à l'utilisateur d'effacer ses
    // données ou de reconfigurer la PWA.
    if (window.AuthAPI && AuthAPI.isAuthenticated()) {
        AuthAPI.syncLog(entry).then(result => { if (!result) queueSyncItem('log', entry); });
    } else {
        queueSyncItem('log', entry);
    }
}

async function syncPending() {
    if (!navigator.onLine) return;
    let out = load(KEYS.outbox, []);
    for (const item of out) {
        try {
            const remote = await client.verifierChassis(item.vin);
            if (remote) {
                out = out.filter(x => x.id !== item.id);
                save(KEYS.outbox, out);
                addLog('Recherche via N° Châssis ' + item.vin, 'success', 'Recherche synchronisée.', { vin: item.vin });
            }
        } catch(e) { break; }
    }
}

// ================================================================
// FILE D'ATTENTE DES RECHERCHES ET LOGS NON SYNCHRONISÉS — comble un
// vrai trou : AuthAPI.syncSearch()/syncLog() (voir js/auth-api.js)
// n'essaient qu'UNE SEULE FOIS, et avalent silencieusement l'échec
// ("conservé localement") sans jamais retenter. Une recherche ou un
// log créé hors ligne restait donc visible sur l'appareil, mais ne
// rejoignait JAMAIS la base serveur, sauf si la connexion était déjà
// là pile au moment de l'action. Ce sont pourtant les deux données les
// plus importantes à synchroniser (preuve de contrôle + diagnostic
// technique) — chaque échec est désormais mis en file, puis retenté
// automatiquement dès le retour de connexion, sans jamais être perdu.
// ================================================================
function queueSyncItem(kind, payload) {
    const queue = load(KEYS.syncQueue, []);
    queue.push({ id: 'Q-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6), kind, payload, attempts: 0, createdAt: new Date().toISOString(), nextAttemptAt: 0 });
    save(KEYS.syncQueue, queue);
}

// Backoff exponentiel (plafonné à 60 min entre deux tentatives), et
// abandon après 15 échecs (~plusieurs heures) — CORRECTIF CRITIQUE :
// la version précédente retentait CHAQUE élément en échec TOUTES LES
// 60 SECONDES, indéfiniment, sans aucune limite. Un log qui échoue de
// façon permanente (session expirée, par exemple) déclenchait donc un
// flot de requêtes identiques vers /api/telemetry/event — exactement
// le comportement que le filtre anti-DDoS de l'hébergeur a fini par
// bloquer (7 jours de blocage complet du site pour l'IP concernée).
// Un échec transitoire (coupure réseau ponctuelle) reste retenté
// rapidement au début ; un échec qui persiste ralentit fortement,
// jusqu'à abandon plutôt que de continuer indéfiniment.
function delaiProchaineTentative(attempts) {
    return Math.min(60, Math.pow(2, attempts)) * 60000; // minutes -> ms, plafonné à 60 min
}
const MAX_TENTATIVES_SYNC = 15;

async function syncPendingSearchesAndLogs() {
    if (!navigator.onLine || !window.AuthAPI || !AuthAPI.isAuthenticated()) return;
    const queue = load(KEYS.syncQueue, []);
    if (!queue.length) return;
    const remaining = [];
    let synced = 0;
    let abandonnes = 0;
    const maintenant = Date.now();
    for (const item of queue) {
        if ((item.nextAttemptAt || 0) > maintenant) { remaining.push(item); continue; } // pas encore l'heure de retenter celui-ci
        try {
            const result = item.kind === 'search' ? await AuthAPI.syncSearch(item.payload) : await AuthAPI.syncLog(item.payload);
            if (result) { synced++; continue; } // envoyé avec succès : retiré de la file
            item.attempts = (item.attempts || 0) + 1;
            if (item.attempts >= MAX_TENTATIVES_SYNC) { abandonnes++; continue; } // abandon définitif — ne JAMAIS retenter en boucle infinie
            item.nextAttemptAt = maintenant + delaiProchaineTentative(item.attempts);
            remaining.push(item);
        } catch (e) {
            item.attempts = (item.attempts || 0) + 1;
            if (item.attempts >= MAX_TENTATIVES_SYNC) { abandonnes++; continue; }
            item.nextAttemptAt = maintenant + delaiProchaineTentative(item.attempts);
            remaining.push(item);
        }
    }
    save(KEYS.syncQueue, remaining);
    // Ce message reste PUREMENT LOCAL (pas de addLog(), donc pas de nouvel
    // appel à /api/telemetry/event) — le journaliser sur le serveur ici
    // recréerait exactement le risque qu'on corrige.
    if (abandonnes) console.warn(`${abandonnes} élément(s) de la file de synchronisation abandonné(s) après ${MAX_TENTATIVES_SYNC} échecs — probable session expirée.`);
    if (synced) {
        addLog('Synchronisation différée', 'success', `${synced} élément(s) enregistré(s) hors ligne ont été synchronisés avec le serveur.`, { restants: remaining.length, abandonnes });
    }
}

function wireLogin() {
    const form = document.getElementById('login-form');
    if (!form) return;
    form.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const submit = document.getElementById('login-submit');
        wireAuthError('login-error', '');
        if (!email || !password) {
            wireAuthError('login-error', 'Renseignez votre e-mail et votre mot de passe.');
            return;
        }
        submit.disabled = true;
        submit.innerHTML = '<span class="loading-spinner"></span> Connexion…';
        try {
            await AuthAPI.login(email, password);
            toast('Connexion réussie', 'Bienvenue sur Oracle.', 'success');
            enterApp();
        } catch (err) {
            wireAuthError('login-error', translateErrorMessage(err.message) || 'Identifiants incorrects.');
        } finally {
            submit.disabled = false;
            submit.innerHTML = '<i data-lucide="log-in"></i> Se connecter';
            lucide.createIcons();
        }
    };
}

function wireRegister() {
    const form = document.getElementById('register-form');
    if (!form) return;

    const pwdInput = document.getElementById('reg-password');
    const confirmInput = document.getElementById('reg-confirm');
    const pwdWrap = document.getElementById('reg-password-wrap');
    const confirmWrap = document.getElementById('reg-confirm-wrap');
    const pwdHint = document.getElementById('reg-password-hint');
    const confirmHint = document.getElementById('reg-confirm-hint');

    // Validation en direct : conformité du mot de passe (8 caractères
    // minimum) et concordance avec sa confirmation, mise à jour à chaque
    // frappe sur l'un ou l'autre champ.
    const checkPasswords = () => {
        const pwd = pwdInput.value;
        const confirm = confirmInput.value;

        const pwdValid = pwd.length >= 8;
        pwdWrap.classList.toggle('valid', pwdValid);
        pwdHint.innerHTML = pwd.length === 0
            ? 'Au moins 8 caractères'
            : pwdValid
                ? '<span class="ready"><i data-lucide="check-circle-2" style="width:12px;height:12px;display:inline"></i> Mot de passe conforme</span>'
                : `<span style="color:var(--red)">${8 - pwd.length} caractère${8 - pwd.length > 1 ? 's' : ''} manquant${8 - pwd.length > 1 ? 's' : ''}</span>`;

        const confirmMatches = confirm.length > 0 && confirm === pwd;
        const confirmMismatch = confirm.length > 0 && confirm !== pwd;
        confirmWrap.classList.toggle('valid', confirmMatches);
        confirmHint.innerHTML = confirm.length === 0
            ? ''
            : confirmMatches
                ? '<span class="ready"><i data-lucide="check-circle-2" style="width:12px;height:12px;display:inline"></i> Les mots de passe correspondent</span>'
                : '<span style="color:var(--red)">Les mots de passe ne correspondent pas</span>';

        lucide.createIcons();
    };
    pwdInput.oninput = checkPasswords;
    confirmInput.oninput = checkPasswords;

    form.onsubmit = async (e) => {
        e.preventDefault();
        const nom = document.getElementById('reg-nom').value.trim();
        const prenoms = document.getElementById('reg-prenoms').value.trim();
        const matricule = document.getElementById('reg-matricule').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm').value;
        const acceptedCgu = document.getElementById('reg-cgu').checked;
        const submit = document.getElementById('register-submit');
        wireAuthError('register-error', '');

        if (!nom || !prenoms || !matricule || !email || !password) {
            wireAuthError('register-error', 'Tous les champs sont obligatoires.');
            return;
        }
        if (password.length < 8) {
            wireAuthError('register-error', 'Le mot de passe doit contenir au moins 8 caractères.');
            return;
        }
        if (password !== confirmPassword) {
            wireAuthError('register-error', 'La confirmation du mot de passe ne correspond pas.');
            return;
        }
        if (!acceptedCgu) {
            wireAuthError('register-error', 'Vous devez accepter les Conditions Générales d\'Utilisation.');
            return;
        }

        submit.disabled = true;
        submit.innerHTML = '<span class="loading-spinner"></span> Création…';
        try {
            await AuthAPI.register({ nom, prenoms, matricule, email, password, confirmPassword, acceptedCgu });
            toast('Compte créé', 'Bienvenue sur Oracle.', 'success');
            enterApp();
        } catch (err) {
            wireAuthError('register-error', translateErrorMessage(err.message) || 'Impossible de créer le compte.');
        } finally {
            submit.disabled = false;
            submit.innerHTML = '<i data-lucide="user-plus"></i> Créer mon compte';
            lucide.createIcons();
        }
    };
}

/** Bascule de l'écran de connexion/inscription vers l'application. */
function enterApp() {
    document.body.classList.remove('auth-mode');
    page = 'home';
    if (permission !== 'granted') {
        renderPermission(null);
    } else {
        startGpsBackground();
        document.getElementById('permission-root').innerHTML = '';
    }
    syncPendingImmatriculations();
    syncPendingSearchesAndLogs();
    restoreServerData();
    syncRegistryDelta();
    requestWakeLock();
    render();
}

function render() {
    // Sondage automatique du panneau Administration — seule zone où
    // l'action d'UNE autre personne (un agent qui s'inscrit, une erreur
    // qui survient ailleurs) doit devenir visible sans recharger. Démarré
    // seulement en entrant sur cette page, arrêté en la quittant — pour
    // ne jamais reproduire l'incident de sondage trop large qui a
    // provoqué le blocage 429 côté hébergeur.
    manageAdminAutoRefresh(page === 'admin-users');
    manageSyncStatusAutoRefresh(page === 'sync-status');

    const authPages = ['login', 'register'];
    document.body.classList.toggle('auth-mode', authPages.includes(page));

    if (authPages.includes(page)) {
        const content = document.getElementById('content');
        content.innerHTML = page === 'login' ? renderLogin() : renderRegister();
        if (page === 'login') wireLogin(); else wireRegister();
        lucide.createIcons();
        return;
    }

    renderChrome();
    const content = document.getElementById('content');
    const adminOnlyPages = ['admin-users'];
    if (adminOnlyPages.includes(page) && !(window.AuthAPI && AuthAPI.isAdmin())) {
        page = 'home';
    }
    switch(page) {
        case 'home': content.innerHTML = renderHome(); break;
        case 'search': content.innerHTML = renderSearch(); break;
        case 'history': content.innerHTML = renderHistory(); break;
        case 'positions':
            adminMapSelection = 'self';
            mapDataSource = null;
            content.innerHTML = renderPositions();
            break;
        case 'sync-status': content.innerHTML = renderSyncStatusShell(); loadSyncStatusData(); break;
        case 'logs': content.innerHTML = renderLogs(); break;
        case 'errors': content.innerHTML = renderErrors(); break;
        case 'guide': content.innerHTML = renderGuide(); break;
        case 'about': content.innerHTML = renderAbout(); break;
        case 'admin-users': content.innerHTML = renderAdminUsersShell(); loadAdminUsersData(); break;
        default: content.innerHTML = '<div class="empty"><h3>Page introuvable</h3></div>';
    }
    wire();
    if (page === 'positions') {
        setTimeout(renderMap, 20);
        if (window.AuthAPI && AuthAPI.isAdmin()) setTimeout(loadAdminPositionsSelector, 20);
    }
    if (page === 'home') {
        maybeShowInstallInvite();
    }
    lucide.createIcons();
    renderGpsBanner();
    document.getElementById('crumb-page').textContent = pages[page] || 'Accueil';

    // Reflète toujours la page active dans l'URL (#historique, #logs...) —
    // replaceState plutôt que location.hash= pour ne pas déclencher de
    // hashchange (qui provoquerait un rendu en boucle) tout en gardant
    // l'URL synchronisée pour qu'un rechargement retombe au bon endroit.
    if (VALID_HASH_PAGES.includes(page)) {
        const newHash = '#' + page;
        // IMPORTANT : `history` est déjà utilisé dans ce fichier comme nom
        // de variable pour le tableau des recherches locales — il masque
        // totalement l'objet natif window.history dans toute cette portée.
        // On doit donc toujours passer par window.history explicitement ici,
        // jamais par le nom nu `history`.
        if (location.hash !== newHash) window.history.replaceState(null, '', newHash);
    }
}

// ================================================================
// REGISTRE — recherche directe en base MySQL (voir plus bas), avec un
// cache local léger pour le hors ligne, alimenté par les recherches
// réellement effectuées par l'agent (jamais un chargement global).
// ================================================================

const IMMAT_PENDING_KEY = 'oracle_immatriculations_pending_sync_v1';

// ================================================================
// RECHERCHE DIRECTE (MySQL) + cache local léger pour le hors ligne.
// Depuis la migration vers une vraie base de données, il n'y a plus de
// fragments à charger : chaque recherche interroge directement le
// serveur (index MySQL sur châssis/immatriculation, quasi instantané
// même sur des centaines de milliers de fiches). Le cache local ne
// sert plus qu'au HORS LIGNE : il se remplit organiquement, au fil des
// recherches réellement effectuées par l'agent (jamais un
// préchargement global — inutile et coûteux, comme avant sur GitHub).
// ================================================================
// ================================================================
// INDEXEDDB — miroir local COMPLET du registre, pas juste les
// véhicules déjà recherchés. Objectif : une recherche hors ligne doit
// pouvoir aboutir pour N'IMPORTE QUEL véhicule déjà connu du serveur,
// pas seulement ceux que CET agent a personnellement consultés avant.
//
// Alimenté par synchronisation delta (voir syncRegistryDelta) : au
// premier lancement, télécharge tout le registre une fois ; ensuite,
// ne récupère plus que ce qui a changé depuis la dernière synchro,
// déclenchée au démarrage et à chaque retour de connexion. Toute
// nouvelle fiche (import en masse ou découverte terrain) devient donc
// automatiquement cherchable hors ligne à la prochaine synchro — sans
// code particulier à écrire pour chaque cas d'ajout.
// ================================================================
const IDB_NAME = 'oracle_registry_db_v1';
const IDB_STORE = 'vehicles';
const IDB_CURSOR_KEY = 'oracle_registry_sync_cursor_v1';
let idbInstance = null;

function normalizeVin2(v) { return String(v || '').replace(/\s/g, '').toUpperCase(); }
function normalizePlateKey(v) {
    const stripped = normalizePlateInput(v);
    const m = stripped.match(PLATE_CORE_RE);
    return m ? m[1] + 'RB' : stripped;
}
function normalizeOwnerName(n) { return String(n || '').trim().toUpperCase().replace(/\s+/g, ' '); }

function openRegistryDb() {
    if (idbInstance) return Promise.resolve(idbInstance);
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
                const store = db.createObjectStore(IDB_STORE, { keyPath: 'id' });
                store.createIndex('chassisNorm', 'chassisNorm', { unique: false });
                store.createIndex('plateNorm', 'plateNorm', { unique: false });
            }
        };
        req.onsuccess = () => { idbInstance = req.result; resolve(idbInstance); };
        req.onerror = () => reject(req.error);
    });
}

function idbPutAll(records) {
    return openRegistryDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        records.forEach(r => {
            store.put({
                id: r.id,
                nom_prenom: r.nom_prenom || '',
                immatriculation: r.immatriculation || '',
                departement: r.departement || '',
                chassis: r.chassis || '',
                statut: r.statut || '',
                updated_at: r.updated_at || '',
                chassisNorm: normalizeVin2(r.chassis || ''),
                plateNorm: normalizePlateKey(r.immatriculation || '')
            });
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    }));
}

function idbQueryByIndex(indexName, value) {
    return openRegistryDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const idx = tx.objectStore(IDB_STORE).index(indexName);
        const req = idx.getAll(value);
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
    }));
}

/** Nombre de fiches réellement présentes en local (IndexedDB) — lecture
 *  purement locale, aucun réseau, donc rafraîchissable très souvent sans
 *  aucun coût serveur. C'est la vraie mesure de "combien cet appareil a
 *  déjà reçu", contrairement à syncProgressState.done qui ne reflète que
 *  la dernière session de synchro. */
function idbCount() {
    return openRegistryDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).count();
        req.onsuccess = () => resolve(req.result || 0);
        req.onerror = () => reject(req.error);
    }));
}

function loadSyncCursor() {
    try {
        const raw = localStorage.getItem(IDB_CURSOR_KEY);
        return raw ? JSON.parse(raw) : { since: '1970-01-01 00:00:00', sinceId: 0 };
    } catch (e) { return { since: '1970-01-01 00:00:00', sinceId: 0 }; }
}
function saveSyncCursor(cursor) {
    try { localStorage.setItem(IDB_CURSOR_KEY, JSON.stringify(cursor)); } catch (e) {}
}

let registrySyncInFlight = false;
const SESSION_REFRESH_KEY = 'oracle_session_last_refresh_v1';
const SESSION_REFRESH_INTERVAL_MS = 6 * 60 * 60 * 1000;

/** Synchronise IndexedDB avec le serveur, par pages, en repartant
 *  toujours du dernier curseur connu (jamais un retéléchargement complet
 *  après le premier). Interrompue par un rechargement de page ? Reprend
 *  exactement là où elle s'était arrêtée au prochain appel, puisque le
 *  curseur est sauvegardé après chaque page réussie, pas seulement à la
 *  toute fin. */
let syncProgressState = { syncing: false, done: 0, total: 0 };

/** Petit indicateur discret, mis à jour en direct pendant une synchro
 *  longue — sans ça, un agent qui voit l'app ralentir sans explication
 *  croit qu'elle est juste "devenue lente", alors qu'elle travaille en
 *  arrière-plan. Affiché uniquement s'il reste un vrai retard à combler. */
function renderSyncBadge() {
    const el = document.getElementById('sync-progress-badge');
    if (el) {
        if (!syncProgressState.syncing || syncProgressState.total <= 0) { el.style.display = 'none'; }
        else {
            const pct = Math.min(100, Math.round((syncProgressState.done / syncProgressState.total) * 100));
            el.style.display = 'flex';
            el.innerHTML = `<span class="loading-spinner" style="width:11px;height:11px;border-width:2px;border-top-color:var(--orange)"></span> Registre : ${pct}% (${syncProgressState.done.toLocaleString('fr-FR')}/${syncProgressState.total.toLocaleString('fr-FR')})`;
        }
    }
    // Si l'agent regarde justement la page "Synchronisation" pendant
    // qu'une synchro tourne, elle se met à jour en direct plutôt que
    // d'attendre le prochain tic des 5s — uniquement local, sans réseau.
    if (page === 'sync-status') loadSyncStatusData(false);
}

// Avec un registre destiné à dépasser 2,5 à 3,8 millions de fiches, un
// plafond fixe en NOMBRE de fiches par déclenchement (l'ancienne version :
// 20 000) posait un vrai problème d'usage : un agent qui n'ouvre l'app que
// rarement ne progressait jamais au-delà de ce plafond, session après
// session — inutile hors ligne avec seulement 21 000 fiches sur 190 000+.
//
// À la place : un budget de TEMPS (pas de volume). Tant que la connexion
// tient et que le serveur répond, on continue jusqu'à être à jour — une
// synchro complète à l'échelle actuelle (~15-20 secondes pour 190 000
// fiches, mesuré) est largement dans ce budget. Le budget de temps borne
// le pire cas (jamais plus de quelques minutes d'affilée) sans jamais
// artificiellement arrêter une synchro qui aurait pu se terminer.
const SYNC_TIME_BUDGET_MS = 4 * 60 * 1000; // 4 minutes maximum par déclenchement
const SYNC_PAGE_DELAY_MS = 300;
const SYNC_MAX_RETRIES_PER_PAGE = 4;
const SYNC_COOLDOWN_KEY = 'oracle_registry_sync_cooldown_until_v1';

/** Un 429 signifie que le serveur (ou son pare-feu applicatif) demande
 *  explicitement de ralentir — retenter au prochain cycle de 15 minutes
 *  pile pourrait retomber dans la même fenêtre de blocage si plusieurs
 *  appareils la déclenchent ensemble. On impose donc un vrai temps de
 *  repos minimum (15 min par défaut, ou la durée exacte donnée par
 *  Retry-After si le serveur la précise), respecté par TOUS les
 *  déclencheurs (démarrage, retour de connexion, cycle périodique).
 */
function isSyncInCooldown() {
    const until = Number(localStorage.getItem(SYNC_COOLDOWN_KEY) || 0);
    return Date.now() < until;
}
function setSyncCooldown(ms) {
    try { localStorage.setItem(SYNC_COOLDOWN_KEY, String(Date.now() + ms)); } catch (e) {}
}

async function syncRegistryDelta() {
    if (registrySyncInFlight) return;
    if (!navigator.onLine) {
        updateSyncState({ status: 'offline', lastAttemptAt: new Date().toISOString() }, false);
        return;
    }
    if (!window.AuthAPI || !AuthAPI.isAuthenticated()) {
        updateSyncState({ status: 'session_expired', lastAttemptAt: new Date().toISOString() }, false);
        return;
    }
    if (isSyncInCooldown()) return; // en repos suite à un 429 récent — on n'insiste pas
    registrySyncInFlight = true;
    updateSyncState({ status: 'syncing', lastAttemptAt: new Date().toISOString(), lastError: null }, false);
    // Une PWA standalone peut rester ouverte plusieurs jours. Le token local
    // peut alors exister tout en étant expiré côté serveur ; dans ce cas la
    // synchronisation échouait jusqu'à une déconnexion/reconnexion manuelle.
    // Revalider ici renouvelle le token sans effacer les données locales.
    let lastSessionRefresh = 0;
    try { lastSessionRefresh = Number(localStorage.getItem(SESSION_REFRESH_KEY) || 0); } catch (e) {}
    if (Date.now() - lastSessionRefresh >= SESSION_REFRESH_INTERVAL_MS) {
        const refreshedUser = await AuthAPI.refreshSession();
        if (!refreshedUser) {
            registrySyncInFlight = false;
            updateSyncState({ status: 'session_expired' }, false);
            return;
        }
        try { localStorage.setItem(SESSION_REFRESH_KEY, String(Date.now())); } catch (e) {}
    }
    const cursor = loadSyncCursor();
    const isFirstSync = cursor.sinceId === 0 && cursor.since === '1970-01-01 00:00:00';
    let totalSynced = 0;
    const startedAt = Date.now();
    syncProgressState = { syncing: true, done: 0, total: 0 };
    try {
        // Total connu une seule fois au début, pour afficher une
        // progression réelle (X/Y) — jamais recalculé à chaque page.
        try {
            const countResult = await AuthAPI.getRegistryCount();
            syncProgressState.total = countResult.total || 0;
            // La vérification du résumé est légère. Si ni la date ni l'id
            // de la dernière ligne serveur n'ont changé, il n'y a aucun
            // delta à télécharger : on évite donc une seconde requête
            // coûteuse vers /api/registry/feed.
            const serverLatest = countResult.latestUpdatedAt ? new Date(toIso(countResult.latestUpdatedAt)).getTime() : 0;
            const localLatest = cursor.since ? new Date(toIso(cursor.since)).getTime() : 0;
            const serverLatestId = Number(countResult.latestUpdatedId || 0);
            if (!isFirstSync && serverLatest && localLatest &&
                (serverLatest < localLatest || (serverLatest === localLatest && serverLatestId <= cursor.sinceId))) {
                updateSyncState({ status: 'up_to_date', pendingCount: 0, lastConfirmedAt: new Date().toISOString(), lastError: null }, false);
                return;
            }
        } catch (e) { /* affichage de progression best-effort seulement */ }

        let hasMore = true;
        let pageCount = 0;
        while (hasMore && (Date.now() - startedAt) < SYNC_TIME_BUDGET_MS) {
            // Un incident serveur transitoire (503, coupure réseau au
            // mauvais moment) ne doit pas faire abandonner toute la
            // synchro — quelques tentatives avec un court délai croissant
            // avant de vraiment renoncer pour cette session.
            //
            // Un 429 (limitation de débit côté hébergeur/pare-feu
            // applicatif) est traité TRÈS différemment d'un 503 ordinaire :
            // retenter rapidement dans ce cas prolonge activement le
            // blocage au lieu de laisser la situation se calmer. On respecte
            // l'en-tête Retry-After s'il est fourni, sinon on attend
            // nettement plus longtemps qu'un simple incident transitoire —
            // et on abandonne la synchro pour CETTE session entière plutôt
            // que d'insister (elle reprendra au prochain déclenchement).
            let page = null;
            let lastPageError = null;
            for (let attempt = 1; attempt <= SYNC_MAX_RETRIES_PER_PAGE; attempt++) {
                try {
                    page = await AuthAPI.syncDelta(cursor.since, cursor.sinceId);
                    lastPageError = null;
                    break;
                } catch (e) {
                    // Filet de sécurité : garantit TOUJOURS un objet
                    // Error exploitable, même si ce qui a été intercepté
                    // ne s'y attendait pas — sans ça, un incident déjà vu
                    // pouvait remonter un message générique vide de sens
                    // ("Échec après plusieurs tentatives", sans détail).
                    lastPageError = (e instanceof Error) ? e : new Error(String(e && e.message ? e.message : e) || 'Erreur réseau inconnue pendant la synchronisation.');
                    if (e && e.status === 429) {
                        const cooldownMs = e.retryAfterMs || 15 * 60 * 1000; // 15 min par défaut si le serveur ne précise pas
                        setSyncCooldown(cooldownMs);
                        addLog('Synchronisation registre', 'warning', `Limitation de débit détectée côté serveur (429) — pause de la synchro pendant ${Math.round(cooldownMs / 60000)} min.`, { retryAfterMs: e.retryAfterMs });
                        break; // n'insiste pas du tout sur un 429 — sort direct de la boucle de retry
                    }
                    if (attempt < SYNC_MAX_RETRIES_PER_PAGE) await new Promise(r => setTimeout(r, 800 * attempt));
                }
            }
            if (!page) {
                // Le cas 429 a déjà été clairement logué (avertissement +
                // temps de repos) juste au-dessus — pas besoin d'un
                // deuxième log "erreur" redondant pour la même cause.
                if (lastPageError && lastPageError.status === 429) return;
                // Toujours un message ET des métadonnées exploitables —
                // plus jamais un {} vide qui ne dit rien du vrai problème.
                throw lastPageError || new Error('Échec de synchronisation : aucune page reçue après plusieurs tentatives, sans détail disponible.');
            }

            if (page.records && page.records.length) {
                await idbPutAll(page.records);
                totalSynced += page.records.length;
                syncProgressState.done += page.records.length;
                renderSyncBadge();
            }
            cursor.since = page.nextSince;
            cursor.sinceId = page.nextSinceId;
            saveSyncCursor(cursor);
            hasMore = page.hasMore;
            pageCount++;

            // Respiration entre deux pages : sans ça, une synchro de
            // rattrapage monopolise le réseau et le thread principal en
            // continu, ce qui rend le reste de l'app perceptiblement lent
            // pendant qu'elle tourne.
            if (hasMore) await new Promise(r => setTimeout(r, SYNC_PAGE_DELAY_MS));
        }
        if (totalSynced > 0) {
            const remaining = hasMore ? ' Suite automatique au prochain cycle (le budget de temps de cette session est atteint).' : '';
            addLog('Synchronisation registre', 'success', isFirstSync
                ? `Registre local initialisé (${totalSynced} fiche(s)).${remaining}`
                : `${totalSynced} fiche(s) mise(s) à jour localement.${remaining}`, { totalSynced, pages: pageCount, resteAFaire: hasMore, dureeMs: Date.now() - startedAt });
        }
        updateSyncState({ status: hasMore ? 'update_available' : 'up_to_date', pendingCount: hasMore ? 1 : 0, lastConfirmedAt: new Date().toISOString(), lastError: null }, false);
    } catch (e) {
        const status = e && e.status === 429 ? 'rate_limited' : (e && e.status === 401 ? 'session_expired' : 'server_unreachable');
        const lastError = e && e.isTimeout
            ? 'Le serveur n’a pas répondu dans le délai prévu.'
            : (e && e.message ? e.message : 'Échec de communication avec le serveur.');
        updateSyncState({ status, lastAttemptAt: new Date().toISOString(), lastError }, false);
        addLog('Synchronisation registre', 'error', translateErrorMessage(e.message) || 'Échec de la synchronisation du registre local.', { messageOriginal: e && e.message, statutHttp: e && e.status });
    } finally {
        registrySyncInFlight = false;
        syncProgressState.syncing = false;
        renderSyncBadge();
        // La page Synchronisation se rafraîchit périodiquement, mais le
        // dashboard reste affiché sans changer de page. Il doit donc être
        // rerendu après la fin réelle du traitement, lorsque l'état n'est
        // plus "syncing" et que le spinner peut disparaître.
        if (page === 'home') render();
    }
}

// Stockage persistant : évite que le navigateur purge IndexedDB sous
// pression d'espace disque (comportement par défaut sinon, notamment
// sur Android en usage intensif).
if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
}

/**
 * Résout une clé (VIN ou plaque) : interroge le serveur (MySQL) si une
 * connexion est disponible, avec repli sur IndexedDB (miroir local
 * complet du registre, pas seulement les recherches précédentes) si
 * hors ligne ou en cas d'échec réseau.
 *
 * Distingue explicitement deux cas très différents pour l'agent :
 * - confirmé en ligne comme inexistant (le serveur a la vérité complète)
 * - introuvable dans le miroir LOCAL, alors que la synchro n'est pas
 *   encore terminée sur cet appareil — le véhicule existe peut-être,
 *   simplement pas encore reçu ici. Confondre les deux a déjà fait
 *   croire à tort à des agents que des véhicules bien réels n'existaient
 *   pas dans le registre.
 */
async function resolveFromCache(key, type) {
    const normalized = type === 'vin' ? normalizeVin2(key) : normalizePlateKey(key);

    if (navigator.onLine && window.AuthAPI && AuthAPI.isAuthenticated()) {
        try {
            const result = await AuthAPI.searchRegistry(type, normalized);
            if (result.found) return { current: result.current, previousOwners: result.previousOwners || [], confirmed: true };
            return { current: null, confirmed: true }; // le serveur a vraiment cherché et n'a rien trouvé
        } catch (e) {
            // Échec réseau malgré navigator.onLine=true (proxy capricieux,
            // requête tombée) — on retombe sur IndexedDB ci-dessous plutôt
            // que d'abandonner.
        }
    }

    try {
        const indexName = type === 'vin' ? 'chassisNorm' : 'plateNorm';
        const rows = await idbQueryByIndex(indexName, normalized);
        const usable = rows.filter(r => (r.nom_prenom || '').trim());
        if (!usable.length) return { current: null, confirmed: false }; // pas confirmé : juste absent du miroir local
        usable.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        const toResult = r => ({ owner: r.nom_prenom || 'Propriétaire non spécifié', plate: r.immatriculation || '', department: r.departement || '', vin: r.chassis || '' });
        const [current, ...previousOwners] = usable;
        return { current: toResult(current), previousOwners: previousOwners.map(toResult), confirmed: false };
    } catch (e) {
        return { current: null, confirmed: false };
    }
}

function mapCachedRecordToResult(r) {
    return {
        owner: r.owner || 'Propriétaire non spécifié',
        plate: r.plate || '',
        department: r.department || '',
        vin: r.vin || ''
    };
}



// ---- File d'attente hors ligne + synchronisation des découvertes ----

function queueImmatSync(payload) {
    const pending = load(IMMAT_PENDING_KEY, []);
    pending.push({ id: 'SYNC-' + Date.now().toString(36).toUpperCase(), record: payload, createdAt: new Date().toISOString(), attempts: 0 });
    save(IMMAT_PENDING_KEY, pending);
}

async function syncPendingImmatriculations() {
    if (!navigator.onLine || !window.AuthAPI || !AuthAPI.isAuthenticated()) return;
    let pending = load(IMMAT_PENDING_KEY, []);
    if (!pending.length) return;
    const MAX_ATTEMPTS = 5;
    const remaining = [];
    for (const item of pending) {
        if ((item.attempts || 0) >= MAX_ATTEMPTS) continue; // abandon silencieux au-delà de 5 essais
        try {
            await AuthAPI.syncImmatriculation(item.record);
        } catch (e) {
            item.attempts = (item.attempts || 0) + 1;
            remaining.push(item);
            continue;
        }
    }
    save(IMMAT_PENDING_KEY, remaining);
}
window.addEventListener('online', () => { syncPendingImmatriculations(); syncPendingSearchesAndLogs(); restoreServerData(); syncRegistryDelta(); });
window.addEventListener('offline', () => {
    updateSyncState({ status: 'offline', lastAttemptAt: new Date().toISOString() });
    if (page === 'sync-status') loadSyncStatusData(false);
});

// Cycle de secours périodique — la plupart des synchros se termineront
// maintenant en une seule fois (budget de temps, plus de plafond de
// volume artificiel), mais ce filet reste utile : nouvelles fiches
// arrivées depuis, ou synchro interrompue par une coupure réseau.
// Sans effet si tout est déjà à jour (sortie immédiate).
//
// 15 min plutôt que 5 : à plusieurs dizaines d'agents connectés, un cycle
// trop rapproché peut cumuler assez de requêtes pour déclencher la
// protection anti-abus de l'hébergeur (429) — déjà vécu une fois. Un peu
// d'aléatoire (±3 min) évite en plus que tous les appareils, démarrés à
// peu près en même temps le matin, tapent le serveur à la même seconde.
// Fraîcheur cible de 10 à 15 minutes, avec un décalage aléatoire propre à
// chaque appareil. La requête périodique ne télécharge rien si le résumé
// serveur n'a pas changé ; le delta n'est demandé qu'en cas de nouveauté.
const SYNC_PERIODIC_INTERVAL_MS = (10 * 60 * 1000) + (Math.random() * 5 * 60 * 1000);
setInterval(() => { syncRegistryDelta(); }, SYNC_PERIODIC_INTERVAL_MS);

// ================================================================
// RESTAURATION DEPUIS LE SERVEUR — historique + logs (donc aussi
// "positions" et "erreurs", qui ne sont que des vues de ces mêmes
// données). Le JSON serveur est la source de vérité quand on est en
// ligne ; localStorage n'est qu'un cache de secours pour le hors-ligne.
// Fusion par id : le serveur fait autorité pour tout ce qu'il connaît
// déjà, on garde en plus les entrées locales pas encore confirmées
// (créées hors ligne, pas encore synchronisées).
// ================================================================

// ================================================================
// CORRESPONDANCE snake_case (MySQL/PHP) -> camelCase (attendu par tout
// le reste de l'app, hérité du format Vercel/GitHub d'origine). Sans
// ça, des champs comme searched_at/created_at arrivent sous un nom que
// le JS ne reconnaît jamais (r.searchedAt = undefined), et fmt() plante
// avec "Invalid time value" dès qu'il tente de formater une date
// inexistante. TOUTE donnée venant d'un endpoint PHP doit passer par
// une de ces fonctions avant d'entrer dans history/logs/adminErrorsCache.
// ================================================================
// snake_case -> camelCase, voir plus haut. `toIso` normalise le format
// de date MySQL ("YYYY-MM-DD HH:MM:SS.mmm", espace) vers un ISO 8601
// strict ("...T...") — Chrome tolère les deux, Safari/iOS est connu
// pour être plus strict et peut refuser le format avec espace.
function toIso(v) {
    if (!v) return v;
    return String(v).includes('T') ? v : String(v).replace(' ', 'T');
}
function mapHistoryRow(r) {
    return {
        id: r.id, searchType: r.search_type, searchKey: r.search_key, vin: r.vin,
        status: r.status, owner: r.owner, plate: r.plate, department: r.department,
        message: r.message, fromCache: !!Number(r.from_cache),
        latitude: r.latitude != null ? Number(r.latitude) : null,
        longitude: r.longitude != null ? Number(r.longitude) : null,
        accuracy: r.accuracy != null ? Number(r.accuracy) : null,
        samples: Number(r.samples || 0), searchedAt: toIso(r.searched_at)
    };
}
function mapLogRow(r) {
    return { id: r.id, userId: r.user_id, type: r.type, status: r.status, message: r.message, metadata: r.metadata, ipAddress: r.ip_address || '', userAgent: r.user_agent || '', createdAt: toIso(r.created_at) };
}
function mapErrorRow(r) {
    return { id: r.id, email: r.email, type: r.type, message: r.message, ipAddress: r.ip_address || '', userAgent: r.user_agent || '', createdAt: toIso(r.created_at) };
}
function mapUserRow(r) {
    return {
        id: r.id, matricule: r.matricule, email: r.email, nom: r.nom, prenoms: r.prenoms,
        role: r.role, active: r.active === undefined ? true : !!Number(r.active),
        createdAt: toIso(r.created_at), lastLogin: r.last_login ? toIso(r.last_login) : null, loginCount: Number(r.login_count || 0),
        registerIp: r.register_ip || '', registerUserAgent: r.register_user_agent || '',
        lastLoginIp: r.last_login_ip || '', lastLoginUserAgent: r.last_login_user_agent || ''
    };
}

function mergeById(localArr, remoteArr, dateField) {
    const map = new Map();
    remoteArr.forEach(r => map.set(r.id, r));
    localArr.forEach(l => { if (!map.has(l.id)) map.set(l.id, l); });
    return Array.from(map.values()).sort((a, b) => new Date(b[dateField] || 0) - new Date(a[dateField] || 0));
}

async function restoreServerData() {
    if (!navigator.onLine || !window.AuthAPI || !AuthAPI.isAuthenticated()) return;
    const currentUser = AuthAPI.getCurrentUser();
    if (!currentUser) return;
    try {
        const [historyResult, logsResult] = await Promise.all([
            AuthAPI.getUserHistory(currentUser.id).catch(() => null),
            AuthAPI.getUserLogs(currentUser.id).catch(() => null)
        ]);
        let changed = false;
        if (historyResult && Array.isArray(historyResult.history)) {
            history = mergeById(history, historyResult.history.map(mapHistoryRow), 'searchedAt');
            save(KEYS.history, history);
            changed = true;
        }
        if (logsResult && Array.isArray(logsResult.logs)) {
            logs = mergeById(logs, logsResult.logs.map(mapLogRow), 'createdAt');
            save(KEYS.logs, logs);
            changed = true;
        }
        if (changed) render();
    } catch (e) {
        // Hors ligne ou erreur réseau : on garde silencieusement ce qui
        // est déjà en localStorage, c'est exactement son rôle de secours.
    }
}


/**
 * Appelée après une recherche par châssis ABOUTIE en ligne (pas
 * depuis le cache) : vérifie si ce véhicule/propriétaire est déjà connu
 * du registre local, sinon l'ajoute (nouvelle ligne = revente détectée
 * si le châssis existait déjà avec un autre propriétaire).
 */
async function maybeRegisterDiscovery(record) {
    if (record.status !== 'found' || record.fromCache || !record.vin) return;

    const payload = {
        'nom et prénom': record.owner || '',
        immatriculation: record.plate || '',
        'département': record.department || '',
        'châssis': record.vin || '',
        statut: 'OK',
        source: 'direct'
    };

    // Toute la logique anti-doublon / enrichissement vit désormais côté
    // serveur (une seule requête MySQL indexée) — le client n'a plus
    // besoin de charger quoi que ce soit pour la reproduire localement.
    if (!navigator.onLine || !window.AuthAPI || !AuthAPI.isAuthenticated()) {
        queueImmatSync(payload);
        return;
    }
    try {
        const result = await AuthAPI.syncImmatriculation(payload);
        // Rend la fiche immédiatement cherchable hors ligne, sans attendre
        // la prochaine synchronisation delta — écrite directement à
        // partir de ce que le serveur a effectivement enregistré (source
        // de vérité), pas des valeurs qu'on vient d'envoyer.
        if (result.record) await idbPutAll([result.record]);
        addLog('Synchronisation immatriculation', 'success', result.added ? 'Nouvelle fiche enregistrée' : 'Fiche existante mise à jour', { plaque: record.plate, vin: record.vin });
    } catch (e) {
        addLog('Synchronisation immatriculation', 'error', translateErrorMessage(e.message) || 'Erreur inconnue', { plaque: record.plate, vin: record.vin });
        queueImmatSync(payload);
    }
}

async function runImmatSearch(value) {
    const raw = String(value || '').trim();
    const normalized = completePlate(raw) || normalizePlateInput(raw);
    const dedicatedSubmit = document.getElementById('immat-submit');
    const submit = dedicatedSubmit || document.getElementById('home-search-btn');
    const isHomeContext = !dedicatedSubmit;
    const resultBox = getActiveResultBox();
    if (!raw) { toast('Immatriculation invalide', 'Saisissez un numéro d’immatriculation.', 'error'); return; }
    if (submit) { submit.disabled=true; submit.innerHTML = isHomeContext ? '<span class="loading-spinner"></span>' : '<span class="loading-spinner"></span> Recherche…'; }
    try {
        const gps = await captureGpsSilent();
        if (gps.latitude != null) resetGpsFailStreak(); else bumpGpsFailStreak();
        const resolved = await resolveFromCache(raw, 'immat');
        // La consultation du registre local est quasi instantanée, mais on
        // simule la même durée que la recherche par châssis (appel réseau
        // réel) pour une expérience cohérente entre les deux modes.
        await new Promise(r => setTimeout(r, 9000 + Math.random() * 2000));
        const data = resolved.current
            ? { status:'found', ...mapCachedRecordToResult(resolved.current), fromCache: true, message:'Correspondance trouvée dans le registre local.', previousOwners: resolved.previousOwners.map(p => ({ ...mapCachedRecordToResult(p) })) }
            : resolved.confirmed
                ? { status:'not_found', message:'Aucune donnée trouvée pour cette immatriculation.' }
                : { status:'unavailable', message: "Aucune correspondance dans les données déjà présentes sur cet appareil — sans connexion, impossible de confirmer si ce véhicule existe réellement ou si sa fiche n'est pas encore synchronisée ici. Réessayez une fois en ligne." };
        const record = {
            ...data,
            id: id(),
            searchType: 'immatriculation',
            searchKey: normalized,
            immatriculation: normalized,
            vin: data.vin || '',
            searchedAt: new Date().toISOString(),
            latitude: gps.latitude,
            longitude: gps.longitude,
            accuracy: gps.accuracy,
            samples: gps.samples || 0
        };
        if (!gps.latitude && gps.errorCode) {
            addLog('Position non obtenue', 'warning', `Recherche immatriculation enregistrée sans coordonnées — ${gps.errorLabel || gps.errorCode}.`, { errorCode: gps.errorCode, immatriculation: normalized });
        }
        history=[record,...history]; save(KEYS.history,history);
        if (window.AuthAPI) {
            AuthAPI.syncSearch(record).then(result => {
                if (!result) {
                    queueSyncItem('search', record);
                    const failure = AuthAPI.lastSyncError || { status: 0, message: 'Échec inconnu.' };
                    addLog('Synchronisation recherche', 'error', `Recherche non envoyée au serveur : ${failure.message}`, { httpStatus: failure.status || 'réseau', recordId: record.id });
                }
            });
        }
        addLog('Recherche via immatriculation ' + normalized,
            resolved.current ? 'success' : (resolved.confirmed ? 'warning' : 'warning'),
            resolved.current ? 'Immatriculation identifiée' : (resolved.confirmed ? 'Immatriculation non trouvée (confirmé)' : 'Introuvable en local, synchro possiblement incomplète — pas confirmé'),
            { immatriculation: normalized });
        if(resultBox) { resultBox.innerHTML=buildResult(record); lucide.createIcons(); scrollToResultCard(); }
        clearActiveSearchInputs();

        toast(
            resolved.current ? 'Immatriculation identifiée' : (resolved.confirmed ? 'Introuvable' : 'Non confirmé'),
            resolved.current ? 'Correspondance trouvée dans le registre local.' : (resolved.confirmed ? 'Aucun enregistrement trouvé.' : 'Absent des données déjà synchronisées sur cet appareil — pas de certitude sans connexion.'),
            resolved.current ? 'success' : (resolved.confirmed ? 'info' : 'warning')
        );
    } catch(error) {
        addLog('Recherche via immatriculation ' + normalized, 'error', error.message, {immatriculation:normalized});
        toast('Erreur',error.message,'error');
    }
    finally {
        if (submit) {
            submit.innerHTML = isHomeContext ? '<i data-lucide="search" style="width:20px;height:20px"></i>' : '<i data-lucide="search"></i> Rechercher';
            const inputEl = document.getElementById(isHomeContext ? 'home-vin' : 'immat-input');
            const val = inputEl ? inputEl.value : '';
            submit.disabled = isHomeContext ? !(isValidVin(val) || !!completePlate(val)) : !completePlate(val);
            lucide.createIcons();
        }
    }
}
